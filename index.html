:root{--bg:#FFFFFF;--panel:#FFFFFF;--ink:#14231F;--muted:#55665F;--line:#D7DED9;--soft:#E8EEEA;--side:#0F3A33;--side-ink:#E3EEEA;--side-muted:#9DBDB3;--accent:#E9771F;--accent-ink:#1A0E03;--ok:#2E7D4F;--warn:#9A6412;--bad:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1412;--panel:#15201C;--ink:#E2EBE7;--muted:#98AAA3;--line:#2A3834;--soft:#1C2925;--side:#09241F;--ok:#5DBB86;--warn:#E0A84A;--bad:#F08A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1412;--panel:#15201C;--ink:#E2EBE7;--muted:#98AAA3;--line:#2A3834;--soft:#1C2925;--side:#09241F;--ok:#5DBB86;--warn:#E0A84A;--bad:#F08A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-stretch:82%;font-weight:700;line-height:1.15;margin:0}
h1{font-size:1.9rem}h2{font-size:1.3rem}h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:6px;padding:.55rem 1rem;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:.3rem .65rem;font-size:.85rem}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
input,select,textarea{width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.25rem}
.field{margin-bottom:.8rem}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
/* login */
.login{min-height:100%;display:grid;place-items:center;padding:1.5rem}
.login-box{width:100%;max-width:420px}
.brand{display:flex;align-items:center;gap:.6rem;margin-bottom:1.6rem}
.brand-mark{width:14px;height:44px;background:var(--accent)}
.brand small{display:block;color:var(--muted);font-size:.85rem}
.login-box .card{padding:1.5rem}
.err{color:var(--bad);font-size:.88rem;margin-top:.4rem}
details{margin-top:1rem;font-size:.88rem;color:var(--muted)}
details table{margin-top:.5rem}
/* shell */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:1.4rem 1rem;display:flex;flex-direction:column;gap:1.2rem;position:sticky;top:0;height:100vh;height:100dvh}
.who{border-left:6px solid var(--accent);padding-left:.75rem}
.who strong{display:block;font-stretch:85%;font-size:1.1rem}
.who span{color:var(--side-muted);font-size:.85rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:transparent;border:0;color:var(--side-ink);text-align:left;padding:.55rem .7rem;border-radius:6px}
.nav button[aria-current="page"]{background:rgba(255,255,255,.1);box-shadow:inset 3px 0 0 var(--accent)}
.side .foot{margin-top:auto;font-size:.8rem;color:var(--side-muted)}
.side .foot button{color:var(--side-ink);border-color:rgba(255,255,255,.25)}
main{padding:1.8rem clamp(1rem,3vw,2.5rem);min-width:0}
.head{margin-bottom:1.4rem}
.head p{color:var(--muted);margin:.35rem 0 0;max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.2rem;margin-bottom:1rem}
.kpis{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:1rem}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem}
.kpi b{display:block;font-size:2rem;font-stretch:78%;line-height:1}
.kpi span{color:var(--muted);font-size:.85rem}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;color:var(--muted);font-weight:500;padding:.45rem .5rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.55rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
.tag{display:inline-block;font-size:.78rem;padding:.1rem .5rem;border-radius:999px;background:var(--soft);white-space:nowrap}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;margin:.3rem 0}
.bar i{display:block;height:100%;background:var(--ok)}
.ind{display:grid;grid-template-columns:1fr auto;gap:.2rem 1rem;padding:.6rem 0;border-top:1px solid var(--line)}
.ind:first-of-type{border-top:0}
.ind .num{font-stretch:80%;font-weight:600;text-align:right}
.muted{color:var(--muted)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--warn);padding-left:.6rem;margin:.6rem 0}
.empty{color:var(--muted);padding:.6rem 0}
.demo{font-size:.75rem;color:var(--warn)}
.bar{position:relative}.bar.lg{height:14px;border-radius:7px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.bar .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.7}
.strat-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:.8rem}
.score b{display:block;font-size:2.6rem;font-stretch:75%;line-height:1;text-align:right}
.axe{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:.1rem 1rem;padding:.7rem 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.axe:hover{background:var(--soft)}
.axe .num{text-align:right;font-weight:600;font-stretch:80%}
.legend{font-size:.8rem;color:var(--muted);margin-top:.6rem}
.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{display:flex;align-items:center;gap:1rem;padding:.6rem clamp(1rem,3vw,2.5rem)}
.logo-btn{display:flex;align-items:center;gap:.6rem;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.logo-btn img{width:48px;height:48px;border-radius:50%;background:#fff;object-fit:contain}
.logo-btn strong{display:block;font-stretch:82%;font-size:1.05rem;line-height:1.1}.logo-btn small{color:var(--muted);font-size:.78rem}
.back{border-left:1px solid var(--line)!important;padding-left:1rem!important}
.logo-lg{width:96px;height:96px;border-radius:50%;background:#fff;object-fit:contain}
@media (max-width:600px){.logo-btn span{display:none}}
.back{background:none;border:0;font-weight:600;padding:.3rem 0;color:var(--ink)}
.back:hover{color:var(--accent)}
.who2{margin-left:auto;font-size:.88rem;color:var(--muted);text-align:right}
.tiles{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.3rem;text-align:left;min-height:130px}
.tile:hover{border-color:var(--accent)}
.tile p{color:var(--muted);margin:.4rem 0 0}
.badge{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:.8rem;border-radius:999px;padding:0 .5rem;vertical-align:middle;font-stretch:100%}
@media (max-width:600px){.who2{display:none}.top-in .btn{margin-left:auto}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem;margin:.2rem 0 .8rem}
.facts div{background:var(--soft);border-radius:8px;padding:.5rem .7rem}.facts span{display:block;font-size:.78rem;color:var(--muted)}
.team{margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--line)}.team h3{margin-bottom:.5rem}
.chip{display:inline-flex;align-items:center;gap:.2rem;background:var(--soft);border-radius:999px;padding:.05rem .55rem;margin:.1rem 0;font-size:.85rem;white-space:nowrap}
.chip .x{background:none;border:0;color:var(--bad);font-weight:700;padding:0 .1rem;line-height:1}
.report{background:#fff;color:#14231F;border:1px solid var(--line);border-radius:10px;padding:1.6rem}
.rep-head{display:flex;gap:1rem;align-items:center;border-bottom:2px solid #E9771F;padding-bottom:1rem;margin-bottom:1rem}
.rep-head img{width:80px;height:80px;border-radius:50%;object-fit:contain}.rep-head p{margin:.2rem 0 0;color:#55665F;font-size:.9rem}
.rep-sec{margin-top:1.4rem;break-inside:avoid-page}.rep-sec h2{font-size:1.1rem;margin-bottom:.4rem}
@media print{.top,.noprint{display:none!important}main{padding:0!important}body{background:#fff}.report{border:0;padding:0}.tbl{overflow:visible}th,td{font-size:9pt}@page{margin:14mm}}
.lvl1{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;align-items:start}@media (max-width:900px){.lvl1{grid-template-columns:1fr}}
.blk h2{font-size:1.05rem;margin-bottom:.6rem}.lu{margin-top:.8rem;border-top:1px solid var(--line);padding-top:.6rem}.lu p{margin:.3rem 0}
.lvl2{margin-top:1.5rem}.projA{max-width:520px;margin:0 auto 1rem;text-align:center;border:1px solid var(--ink);border-radius:10px;padding:1rem;background:var(--panel)}.projA h2{margin:.2rem 0}
.tiles.six{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));border-top:2px solid var(--ink);padding-top:1rem}.tiles.six .tile{display:flex;flex-direction:column;justify-content:flex-start;min-height:150px}.tiles.six .tile h2{font-size:1.02rem;overflow-wrap:anywhere}.tiles.six .tile p{font-size:.88rem}
.crumb{color:var(--muted);margin:0 0 .6rem}.lnk{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline}
.subnav.minor button{font-size:.9rem;padding:.4rem .6rem}
.subnav{display:flex;gap:.3rem;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:1rem}.subnav button{background:none;border:0;padding:.55rem .8rem;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}.subnav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1rem;align-items:start}@media (max-width:980px){.split{grid-template-columns:1fr}}
table.edt input,table.edt select{min-width:90px;padding:.35rem .4rem}td.num,th.num{text-align:right;white-space:nowrap}
form.trait{display:grid;gap:.3rem;min-width:180px}
.doc{background:#fff;color:#111;border:1px solid var(--line);padding:2rem clamp(1rem,4vw,3rem);font-family:Cambria,Georgia,'Times New Roman',serif;font-size:15px;line-height:1.55;max-width:900px}
.doc h1,.doc h2,.doc h3,.doc h4,.doc h5{font-family:inherit;font-stretch:100%;color:#111}.doc h2{font-size:1.15rem;margin:1.6rem 0 .5rem}.doc h2.ph{border-bottom:1px solid #111;padding-bottom:.2rem}.doc h3{font-size:1.02rem;margin:1.1rem 0 .4rem}.doc h4{font-size:.98rem;margin:1rem 0 .3rem}.doc h5{font-size:.95rem;margin:.8rem 0 .3rem;font-style:italic}
.doc table.dt{width:100%;border-collapse:collapse;margin:.4rem 0 .8rem;font-size:.9rem}.doc table.dt th,.doc table.dt td{border:1px solid #777;padding:.3rem .45rem;text-align:left;vertical-align:top}.doc table.dt th{background:#f0f0f0;font-weight:700}.doc table.dt .num{text-align:right}
.doc .muted{color:#555}.doc ul{margin:.3rem 0 .6rem;padding-left:1.3rem}
.doc-head{display:flex;gap:.8rem;align-items:center;border-bottom:1px solid #111;padding-bottom:.6rem;margin-bottom:1.2rem}.doc-head img{width:70px;height:70px;object-fit:contain}.doc-head span{font-size:.85rem;font-style:italic}
.doc-t{text-align:center;text-transform:uppercase;font-size:1.35rem!important;margin:.6rem 0 .2rem!important}.doc-s{text-align:center;margin:0 0 1.2rem}.doc-sign{margin-top:2rem;text-align:right}
.doc-garde{text-align:center;padding:2rem 0 3rem;border-bottom:1px solid #111;margin-bottom:1.5rem}.doc-garde img{width:150px;height:150px;object-fit:contain}.doc-garde .g1{font-weight:700;font-size:1.1rem}.doc-garde .g2{font-size:2rem;font-weight:700;letter-spacing:.1em;margin:1.5rem 0}.doc-garde .g3{font-weight:700;font-size:1.05rem;max-width:620px;margin:0 auto 1rem}.doc-garde .g4{margin-top:2rem;font-weight:700}
#printzone{display:none}@media print{body.print-doc #root{display:none!important}body.print-doc #printzone{display:block;border:0;padding:0;max-width:none;width:100%}.doc h2,.doc h3{break-after:avoid}.doc table{break-inside:auto}.doc-garde{break-after:page}}
.fiche .field{margin-bottom:1.1rem}.req{color:var(--bad)}
.opts{display:flex;flex-wrap:wrap;gap:.4rem .9rem}.chk{display:flex;align-items:center;gap:.4rem;color:var(--ink);font-size:.95rem;margin:.2rem 0}.chk input{width:auto;margin:0}
.pres{min-width:0;max-width:100%;border:1px solid var(--line);border-radius:10px;padding:1rem;margin:0 0 1.1rem}.pres legend{font-weight:600;padding:0 .4rem}
.add-part{background:var(--soft);border-radius:8px;padding:.8rem;margin-top:.6rem}
.x{background:none;border:0;color:var(--bad);font-weight:700;font-size:1.1rem}
.grid-cnt input{width:4.2rem;padding:.4rem}.grid-cnt th,.grid-cnt td{padding:.4rem .3rem}.grid-cnt tfoot th{color:var(--ink)}
.q-row{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.7rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.fiche-det dl{display:grid;grid-template-columns:minmax(140px,240px) 1fr;gap:.3rem 1rem;margin:0 0 .8rem}.fiche-det dt{color:var(--muted)}.fiche-det dd{margin:0}.fiche-det h4{margin:.6rem 0 .2rem}
details.card summary{cursor:pointer;font-weight:600}
.inl{display:flex;gap:.3rem;min-width:150px}.inl input{width:80px;padding:.3rem .4rem}
@media (max-width:820px){
 .app{grid-template-columns:1fr}
 .side{position:static;height:auto;padding:1rem}
 .nav{flex-direction:row;overflow-x:auto}
 .nav button{white-space:nowrap}
 .side .foot{margin-top:0}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
.pol-list{display:grid;gap:.5rem}.pol-item{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.7rem .85rem;color:var(--ink);font:inherit;cursor:pointer}.pol-item:hover{border-color:var(--accent)}.pol-item .muted{font-size:.85rem}.pol-item[hidden],.pol-cat[hidden]{display:none}.pol-t{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.pol-filtres{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}@media (max-width:600px){.pol-filtres{grid-template-columns:1fr}}
.pol-dh{display:flex;gap:1rem;align-items:center;border-bottom:1px solid var(--line);padding-bottom:.8rem;margin-bottom:.9rem}.pol-dh img{width:64px;height:64px;object-fit:contain}.pol-dh h2{margin:.1rem 0 0}
.pol-file{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:.7rem .85rem;margin:.6rem 0}
.pol-texte p{line-height:1.6;max-width:75ch}.pdf{width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;margin-top:.5rem}
.pol-ack{border-left:4px solid var(--accent)}.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 1rem}
fieldset.field{border:1px solid var(--line);border-radius:8px;padding:.5rem .8rem;margin:0 0 .8rem;min-width:0}fieldset.field legend{font-weight:600;padding:0 .3rem}
.notif{border-left:4px solid var(--accent)}
@media (max-width:600px){.pol-item{padding:.85rem}.pol-ack .btn{width:100%}}
.obs{border-top:1px solid var(--line);padding:.6rem 0}.obs p{margin:.25rem 0}.obs.corr{border-left:3px solid var(--bad);padding-left:.7rem}
.card.soft{background:var(--soft);border:0}@media (max-width:600px){.grid>[style*="span 2"]{grid-column:auto!important}}.moi-lien{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.8rem 1rem}
body.busy,body.busy *{cursor:progress!important}body.busy main{opacity:.7}
</style>
</head>

 return `<div class="field"><label>${label}</label><div class="tbl"><table class="edt"><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}${opt.taux?'<th>Taux</th>':''}${opt.montant?'<th>Montant (FCFA)</th>':''}${ro?'':'<th></th>'}</tr></thead><tbody>

/* sensibilisation de proximité : calculée à partir des fiches validées */
function fichesSeance(p,du,au){return S.fiches.filter(x=>{const f=S.formulaires.find(y=>y.id===x.formId);return x.projetId===p.id&&x.statut==='validee'&&f&&!f.kind&&(!du||x.date>=du)&&(!au||x.date<=au)})}
function proxAnalyse(p,du,au){const fs=fichesSeance(p,du,au);if(!fs.length)return '<p class="muted">Aucune fiche de séance validée sur la période.</p>';
 const parts=fs.flatMap(x=>x.participants||[]),F=parts.filter(q=>q.sexe==='F').length;
 const loc={};fs.forEach(x=>{const f=S.formulaires.find(y=>y.id===x.formId),c=f.champs.find(c=>c.type==='texte'),l=(c&&x.valeurs[c.id]||'Non précisée').trim();loc[l]=loc[l]||{s:0,n:0};loc[l].s++;loc[l].n+=(x.participants||[]).length});
 const nums={};fs.forEach(x=>{const f=S.formulaires.find(y=>y.id===x.formId);f.champs.filter(c=>c.type==='nombre').forEach(c=>{nums[c.label]=(nums[c.label]||0)+nb(x.valeurs[c.id])})});
 const th={};fs.forEach(x=>{const f=S.formulaires.find(y=>y.id===x.formId);f.champs.filter(c=>c.type==='multi'&&/th[eè]me/i.test(c.label)).forEach(c=>(x.valeurs[c.id]||[]).forEach(t=>th[t]=(th[t]||0)+1))});
 const asc=new Set(fs.map(x=>x.auteurId)).size;
 return `<p>Sur la période, ${fmtN(fs.length)} séances validées ont été conduites par ${asc} agent(s), touchant ${fmtN(parts.length)} personnes, dont ${fmtN(F)} femmes (${pc(F,parts.length)}) et ${fmtN(parts.length-F)} hommes. Ces chiffres proviennent directement des fiches et listes de présence saisies sur le terrain et validées.</p>
 <h5>Répartition par localité</h5>${tableDoc(['Localité','Séances','Personnes touchées'],Object.entries(loc).map(([l,v])=>[l,v.s,v.n]),['Total',fs.length,parts.length])}
 <h5>Répartition par sexe et par âge</h5>${tableDoc(["Tranche d'âge",'Femmes','Hommes','Total'],AGES.map(a=>{const f=parts.filter(q=>q.age===a&&q.sexe==='F').length,h=parts.filter(q=>q.age===a&&q.sexe==='H').length;return[a,f,h,f+h]}),['Total',F,parts.length-F,parts.length])}

/* enquête CAP */
function capData(p){const f=S.formulaires.find(x=>x.kind==='cap'&&x.projetId===p.id);if(!f)return null;
 const fs=S.fiches.filter(x=>x.formId===f.id&&x.statut==='validee'),ph=f.champs.find(c=>c.role==='phase'),sx=f.champs.find(c=>c.role==='sexe');
 return {f,ref:fs.filter(x=>x.valeurs[ph.id]==='Référence'),fin:fs.filter(x=>x.valeurs[ph.id]==='Finale'),sx}}
function capAnalyse(p,avecFinale){const d=capData(p);if(!d)return '<p class="muted">Aucun questionnaire CAP n\'est associé à ce projet.</p>';
 const {f,ref,fin,sx}=d;if(!ref.length&&!fin.length)return '<p class="muted">Aucun questionnaire CAP validé pour le moment.</p>';
 const oui=(fs,c)=>fs.filter(x=>x.valeurs[c.id]==='Oui').length,H=fs=>fs.filter(x=>x.valeurs[sx.id]==='Homme').length;
 const themes=[...new Set(f.champs.filter(c=>c.cap).map(c=>c.cap.theme))];let out=`<p>Personnes interrogées : ${ref.length} en phase de référence (${H(ref)} hommes, ${ref.length-H(ref)} femmes)${fin.length?`, ${fin.length} en phase finale`:''}.</p>`;
 const progs=[];
 themes.forEach(t=>{const qs=f.champs.filter(c=>c.cap&&c.cap.theme===t);
  const rows=qs.map(c=>{const r=oui(ref,c),fi=oui(fin,c),tr=ref.length?r/ref.length*100:null,tf=fin.length?fi/fin.length*100:null;
   if(avecFinale&&tr!==null&&tf!==null)progs.push(c.cap.neg?tr-tf:tf-tr);
   return avecFinale&&fin.length?[c.cap.dim,c.label+(c.cap.neg?' (à réduire)':''),r,ref.length?Math.round(tr)+' %':'—',fi,Math.round(tf)+' %']:[c.cap.dim,c.label,oui(ref.filter(x=>x.valeurs[sx.id]==='Homme'),c),oui(ref.filter(x=>x.valeurs[sx.id]==='Femme'),c),r,ref.length?Math.round(tr)+' %':'—']});
  out+=`<h5>${esc(t)}</h5>`+(avecFinale&&fin.length?tableDoc(['Dimension','Indicateur','Référence','Taux réf.','Finale','Taux final'],rows):tableDoc(['Dimension','Indicateur','Hommes','Femmes','Total','Taux'],rows))});
 if(avecFinale&&progs.length){const m=progs.reduce((s,x)=>s+x,0)/progs.length;out+=`<p>Évolution moyenne des indicateurs entre la référence et l'enquête finale : ${m>=0?'+':''}${m.toFixed(2).replace('.',',')} points. Pour les comportements à réduire, une baisse est comptée comme une amélioration.</p>`}
 return out}
/* registre des plaintes */
function plaintesDe(p){const f=S.formulaires.find(x=>x.kind==='plainte'&&x.projetId===p.id);if(!f)return {f:null,l:[]};
 return {f,l:S.fiches.filter(x=>x.formId===f.id&&x.statut!=='rejetee')}}
const plV=(f,x,role)=>{const c=f.champs.find(c=>c.role===role);return c?x.valeurs[c.id]:''};
const plDate=(f,x)=>{const c=f.champs.find(c=>c.type==='date');return c?x.valeurs[c.id]:x.date};
function delai(f,x){const t=x.trait||{};if(!t.date)return null;return Math.max(0,Math.round((new Date(t.date)-new Date(plDate(f,x)))/864e5))}

 const tr=l.filter(x=>(x.trait||{}).statut==='Traitée'),enc=l.length-tr.length,sat=tr.filter(x=>x.trait.satisf==='Oui').length,dl=tr.map(x=>delai(f,x)).filter(x=>x!==null);

 return tableDoc(['Indicateur','Valeur'],[['Nombre total de plaintes enregistrées',l.length],['Plaintes traitées',tr.length],['Plaintes en cours de traitement',enc],['Taux de traitement',pc(tr.length,l.length)],['Plaintes résolues de manière satisfaisante',sat],['Taux de satisfaction (sur les plaintes traitées)',pc(sat,tr.length)]])+
 `<h5>Répartition par catégorie</h5>${tableDoc(['Catégorie','Nombre','Proportion'],cnt('categorie'),['Total',l.length,'100 %'])}
 <h5>Canaux de réception</h5>${tableDoc(['Canal','Nombre','Proportion'],cnt('canal'),['Total',l.length,'100 %'])}

 `<h2>1. Contexte et justification</h2>${LN(ctx).map(x=>`<p>${esc(x)}</p>`).join('')}

function secProg(p){const a=curA();if(a&&a.projetId===p.id)return ecranActivite(a,p);
 const f=editForm&&S.formulaires.find(x=>x.id===editForm&&x.projetId===p.id);
 const tabs=[['plan',"Plan d'activités"],['formulaires','Collecte'],['valid','Validation'],['plaintes','Plaintes'],['cap','Enquête CAP'],['global','Rapport global'],['params','Paramètres']];actTab=progTab;
 const valid=pp=>{const tf=aTraiterF().filter(x=>x.projetId===pp.id),hf=S.fiches.filter(x=>x.projetId===pp.id&&!tf.includes(x));return `<section class="card"><h3>Fiches à traiter (${tf.length})</h3>${ficheTable(tf,true)}</section><section class="card"><h3>Historique</h3>${ficheTable(hf,false)}</section>`};
 return head('Volet programmatique','Activités, TDR, collecte terrain, validation, plaintes, enquêtes et rapports de ce projet.')+
 `<nav class="subnav minor">${tabs.map(([k,l])=>`<button data-act="progTab" data-v="${k}" ${progTab===k?'aria-current="page"':''}>${l}</button>`).join('')}</nav>`+
 (progTab==='formulaires'&&f?formEditeur(f):({plan:ongletPlan,formulaires:ongletForms,valid,plaintes:ongletPlaintes,cap:ongletCap,global:ongletGlobal,params:ongletParams}[progTab]||ongletPlan)(p))}
/* niveau 2 : volet logistique */
function secLogi(p){const l=S.demandes.filter(d=>d.projetId===p.id);
 return head('Volet logistique','Demandes de matériel, de carburant, de véhicule et de mission rattachées à ce projet. Elles sont approuvées par le responsable administratif.')+
 `<form class="card" data-form="demande"><input type="hidden" name="projet" value="${p.id}"><div class="grid">
  <div><label>Type</label><select name="type">${['Matériel','Carburant','Véhicule','Mission','Supports et gadgets','Autre'].map(x=>`<option>${x}</option>`).join('')}</select></div>
  <div style="grid-column:span 2"><label>Objet</label><input name="objet" required></div>
  <div><label>Date souhaitée</label><input type="date" name="pour"></div><div><label>Montant estimé (FCFA)</label><input type="number" min="0" name="montant"></div>
 </div><button class="btn" type="submit">Envoyer la demande</button></form>
 <section class="card"><h3>Demandes du projet (${l.length})</h3>${demTable(l,false)}</section>`}
/* niveau 2 : volet finance */
function secFin(p){return head('Volet finance','Budget du projet, dépenses par activité et par catégorie. Les dépenses se saisissent dans chaque activité, étape « Dépenses ».')+ongletFinances(p)}
/* niveau 2 : volet RH */
function secRH(p){return head('Volet RH','Équipe du projet : postes prévus, postes pourvus, personnes affectées et durée de leurs accès.')+`<section class="card">${equipe(p)}</section>`}
/* actualités et politiques : publication */
function infos(){const ed=can(['DE','RA','RH']),actus=(S.actualites||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)),pols=S.politiques||[];
 return head('Actualités','Ce qui est publié ici apparaît sur la page d\'accueil des chefs de projet et coordonnateurs.')+
 (ed?`<form class="card" data-form="actu"><h3>Publier une information</h3><div class="field"><label>Titre</label><input name="titre" required></div><div class="field"><label>Texte</label><textarea name="texte" rows="4" required></textarea></div><button class="btn" type="submit">Publier</button></form>`:'')+
 `<section class="card"><h3>Informations publiées (${actus.length})</h3>${actus.length?actus.map(x=>`<div class="q-row"><div><b>${esc(x.titre)}</b><br><span class="muted">${fmtD(x.date)} · ${esc(who(x.auteurId))}</span></div>${ed?`<button class="btn danger sm" data-act="delActu" data-id="${x.id}">Retirer</button>`:''}</div>`).join(''):'<p class="empty">Aucune information.</p>'}</section>`+
 `<section class="card"><h3>Politiques et procédures</h3><p>Les politiques et procédures ont désormais leur propre espace : bibliothèque, versions, niveaux d'accès et confirmations de lecture.</p><button class="btn ghost" data-act="polAller" data-v="${polGest()?'gestion':'biblio'}">Ouvrir « Politiques et procédures »</button></section>`}

/* ===== Module transversal : Politiques et procédures de l'organisation ===== */
const POL_CAT=['Politiques institutionnelles','Manuels de procédures administratives et financières','Procédures de gestion des ressources humaines','Procédures logistiques et d\'achats','Politiques de protection et de sauvegarde','Code de conduite','Statuts et règlement intérieur','Documents de gouvernance','Plans stratégiques','Directives opérationnelles','Documents de conformité et de partenariat'];
const POL_NIV={1:'Public',2:'Collaborateurs externes',3:'Personnel interne',4:'Responsables',5:'Confidentiel'};
const POL_NIV_D={1:'Visible sans connexion, une fois publié',2:'Partenaires, prestataires et invités autorisés, et tout le personnel',3:'Tout le personnel de l\'organisation',4:'Fonctions de management uniquement',5:'Uniquement les personnes nommément habilitées'};
const POL_CLR={EXT:2,ASC:3,SUP:3,SE:3,LECT:3,CP:4,DP:4,RA:4,RH:4,CA:4,DE:5};
const POL_VST={brouillon:['Brouillon',''],approbation:['En attente d\'approbation','warn'],approuvee:['Approuvée, à publier','warn'],publiee:['En vigueur','ok'],remplacee:['Remplacée','']};
const POL_EXT=['pdf','doc','docx','odt','xls','xlsx','ods','ppt','pptx','txt'];
const POL_MAX=1.5*1024*1024;
const polT=(...a)=>`<div class="tbl">${tableDoc(...a)}</div>`;
const ORG=()=>(S.org&&S.org.id)||'osv';
let polTab='biblio',polDoc=null,polEdit=null,pubView=false,pubDoc=null;

function ensurePol(){
 S.org=S.org||{id:'osv',nom:'ONG Sécurité Vie'};
 if(!S.pol)S.pol={docs:[],accuses:[],notifs:[]};
 ['docs','accuses','notifs'].forEach(k=>S.pol[k]=S.pol[k]||[]);
 if(!S.postes.some(p=>p.niveau==='EXT'))S.postes.push({id:'po-EXT',intitule:'Collaborateur externe / invité',niveau:'EXT'});
 if(!S.staff.some(s=>s.code==='EXT-1010'))S.staff.push({id:'u10',nom:'Compte démo Invité externe',role:'EXT',posteId:'po-EXT',dept:'',statut:'Invité',bureau:'b1',code:'EXT-1010',actif:true,finAcces:''});
 /* reprise des politiques publiées dans l'ancien écran « Actualités et politiques » */
 if(!S.pol.repris){S.pol.repris=true;
  (S.politiques||[]).forEach(x=>{if(S.pol.docs.some(d=>d.ancienId===x.id))return;
   S.pol.docs.push({id:uid(),ancienId:x.id,org:ORG(),titre:x.titre,categorie:'Politiques institutionnelles',description:'',responsable:who(x.auteurId),niveau:3,publics:[],habilites:[],projets:[],obligatoire:false,dl:true,archive:false,creeLe:x.date||today(),auteurId:x.auteurId,
    versions:[{v:x.version||'1.0',reack:true,statut:'publiee',dateApp:x.date||'',dateEffet:x.date||'',dateRev:'',texte:x.texte||'',note:'Reprise de l\'ancien écran de publication',fichier:null,auteurId:x.auteurId,cree:x.date||today(),publieLe:x.date||today()}]})})}
}
const polGest=()=>can(['DE','RA','RH']);
const polClr=u=>POL_CLR[u.role]||0;
const vPub=d=>{for(let i=d.versions.length-1;i>=0;i--)if(d.versions[i].statut==='publiee')return i;return -1};
const vCour=d=>{const i=vPub(d);return i<0?null:d.versions[i]};
const vDern=d=>d.versions[d.versions.length-1];
const accesOK=(u)=>u.actif&&!(u.finAcces&&u.finAcces<today());
/* public cible : niveau, liste des publics, habilitation nominative pour le confidentiel */
function polCible(d,u){if(!accesOK(u)||d.org!==ORG())return false;
 if(d.niveau===5)return u.role==='DE'||(d.habilites||[]).includes(u.id);
 if(polClr(u)<d.niveau)return false;
 return !(d.publics||[]).length||d.publics.includes(u.role)}
/* ce que la personne connectée peut lire */
function polVoit(d,u=me){if(d.org!==ORG())return false;
 if(['DE','RA','RH'].includes(u.role)&&(d.niveau<5||u.role==='DE'||(d.habilites||[]).includes(u.id)||d.auteurId===u.id))return true;
 return !d.archive&&vPub(d)>=0&&polCible(d,u)}
const polLisibles=()=>S.pol.docs.filter(d=>!d.archive&&vPub(d)>=0&&polVoit(d));
/* accusés : la confirmation vaut depuis la dernière version publiée qui exige une nouvelle lecture */
function polEpoque(d){let e=-1;d.versions.forEach((v,i)=>{if(v.statut==='publiee'||v.statut==='remplacee'){if(v.reack||e<0)e=i}});return e}
function polAccuse(d,u){const e=polEpoque(d);return S.pol.accuses.find(a=>a.docId===d.id&&a.userId===u.id&&a.vIdx>=e)}
const polDoitConfirmer=(d,u=me)=>d.obligatoire&&!d.archive&&vPub(d)>=0&&polCible(d,u)&&!polAccuse(d,u);
const polEnAttente=(u=me)=>S.pol.docs.filter(d=>polDoitConfirmer(d,u));
const polAudience=d=>S.staff.filter(u=>polCible(d,u));
const polNouveau=d=>{const v=vCour(d);return v&&v.publieLe&&(Date.now()-new Date(v.publieLe).getTime())<30*864e5};
const mesNotifs=()=>S.pol.notifs.filter(n=>n.dest.includes(me.id)&&!n.lus.includes(me.id)&&(n.docId?S.pol.docs.some(d=>d.id===n.docId&&polVoit(d)):true));
function polNotifier(d,dest,texte){dest=[...new Set(dest)];if(!dest.length)return 0;S.pol.notifs.unshift({id:uid(),docId:d.id,date:new Date().toISOString(),texte,dest,lus:[]});S.pol.notifs=S.pol.notifs.slice(0,300);return dest.length}
const taille=n=>n>1048576?(n/1048576).toFixed(1).replace('.',',')+' Mo':Math.max(1,Math.round(n/1024))+' Ko';
const vLib=v=>'version '+esc(v.v);
function polStatutDoc(d){if(d.archive)return ['Archivé','']; if(vPub(d)>=0){const l=vDern(d);return l.statut==='publiee'?POL_VST.publiee:['En vigueur · nouvelle version '+POL_VST[l.statut][0].toLowerCase(),'warn']} return POL_VST[vDern(d).statut]}

/* ---------- écran principal ---------- */
function politiques(){
 if(polEdit&&polGest()){const d=S.pol.docs.find(x=>x.id===polEdit);if(d&&polVoit(d))return polFicheGestion(d);polEdit=null}
 if(polDoc){const d=S.pol.docs.find(x=>x.id===polDoc);if(d&&polVoit(d))return polLecture(d);polDoc=null}
 const att=polEnAttente().length,simple=['ASC','EXT'].includes(me.role);
 const tabs=[['biblio','Bibliothèque'],['confirmer',`À confirmer${att?` <span class="badge">${att}</span>`:''}`]];
 if(polGest())tabs.push(['gestion','Gestion des documents'],['suivi','Suivi des confirmations']);
 else if(can(['DP','CA']))tabs.push(['suivi','Suivi des confirmations']);
 if(!tabs.some(t=>t[0]===polTab))polTab='biblio';
 return head('Politiques et procédures',simple?'Les règles et procédures de l\'organisation qui vous concernent.':'Référentiel institutionnel de l\'organisation, commun à tous les projets. Chacun ne voit que les documents de son niveau d\'accès.')+
 `<nav class="subnav minor">${tabs.map(([k,l])=>`<button data-act="polTab" data-v="${k}" ${polTab===k?'aria-current="page"':''}>${l}</button>`).join('')}</nav>`+
 ({biblio:polBiblio,confirmer:polConfirmer,gestion:polGestion,suivi:polSuivi}[polTab])()}

function polCarte(d){const v=vCour(d),req=polDoitConfirmer(d);
 return `<button class="pol-item" data-act="polOuvrir" data-id="${d.id}" data-q="${esc((d.titre+' '+d.categorie+' '+(d.description||'')+' '+(v?v.texte:'')).toLowerCase())}" data-c="${esc(d.categorie)}">
  <span class="pol-t"><b>${esc(d.titre)}</b>${polNouveau(d)?' <span class="tag">Nouveau</span>':''}${req?' <span class="tag warn">Lecture à confirmer</span>':''}</span>
  <span class="muted">${esc(d.categorie)} · ${vLib(v)} · en vigueur depuis le ${fmtD(v.dateEffet||v.publieLe)}${v.fichier?' · fichier '+esc(v.fichier.nom.split('.').pop().toUpperCase()):''}</span></button>`}
function polBiblio(){const l=polLisibles().sort((a,b)=>a.categorie.localeCompare(b.categorie)||a.titre.localeCompare(b.titre)),cats=POL_CAT.filter(c=>l.some(d=>d.categorie===c));
 if(!l.length)return `<section class="card"><p class="empty">Aucun document publié pour votre niveau d'accès.</p></section>`;
 return `<section class="card"><div class="grid pol-filtres"><div><label for="polQ">Rechercher</label><input id="polQ" type="search" placeholder="Titre, mot du texte…" data-pol-q></div>
  <div><label for="polC">Catégorie</label><select id="polC" data-pol-c><option value="">Toutes (${l.length})</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div></div>
  <p class="muted" id="polNb" aria-live="polite" style="margin:.2rem 0 0">${l.length} document(s)</p></section>
 ${cats.map(c=>`<section class="card pol-cat" data-cat="${esc(c)}"><h3>${esc(c)}</h3><div class="pol-list">${l.filter(d=>d.categorie===c).map(polCarte).join('')}</div></section>`).join('')}
 <p class="empty" id="polVide" hidden>Aucun document ne correspond à votre recherche.</p>`}
function polConfirmer(){const l=polEnAttente(),faits=S.pol.accuses.filter(a=>a.userId===me.id).sort((a,b)=>b.date.localeCompare(a.date));
 return `<section class="card"><h3>Documents dont la lecture est obligatoire (${l.length})</h3>${l.length?`<p class="muted">Ouvrez chaque document, lisez-le, puis confirmez votre prise de connaissance.</p><div class="pol-list">${l.map(polCarte).join('')}</div>`:'<p class="empty">Vous êtes à jour : aucune confirmation en attente.</p>'}</section>
 <section class="card"><h3>Mes confirmations (${faits.length})</h3>${faits.length?polT(['Document','Version','Confirmé le'],faits.map(a=>{const d=S.pol.docs.find(x=>x.id===a.docId);return [d?d.titre:'(document supprimé)',a.version,new Date(a.date).toLocaleString('fr-FR')]})):'<p class="empty">Aucune confirmation enregistrée.</p>'}</section>`}

/* ---------- lecture d'un document ---------- */
function polLecture(d){const v=vCour(d),req=polDoitConfirmer(d),ac=polAccuse(d,me),hist=d.versions.filter(x=>['publiee','remplacee'].includes(x.statut)).reverse();
 if(!v)return `<p class="crumb"><button class="lnk" data-act="polRetour">Politiques et procédures</button> › <b>${esc(d.titre)}</b></p><section class="card"><p class="empty">Ce document n'a pas encore de version publiée.</p>${polGest()?`<button class="btn" data-act="polGerer" data-id="${d.id}">Gérer ce document</button>`:''}</section>`;
 return `<p class="crumb"><button class="lnk" data-act="polRetour">Politiques et procédures</button> › <b>${esc(d.titre)}</b></p>
 <article class="card pol-doc"><header class="pol-dh"><img src="${LOGO}" alt="Logo ONG Sécurité Vie"><div><p class="muted" style="margin:0">${esc(S.org.nom)} · ${esc(d.categorie)}</p><h2>${esc(d.titre)}</h2></div></header>
  <div class="facts"><div><span>Version</span><b>${esc(v.v)}</b></div><div><span>Approuvée le</span><b>${fmtD(v.dateApp)}</b></div><div><span>En vigueur depuis</span><b>${fmtD(v.dateEffet||v.publieLe)}</b></div><div><span>Prochaine révision</span><b>${fmtD(v.dateRev)}</b></div><div><span>Responsable</span><b>${esc(d.responsable||'—')}</b></div><div><span>Accès</span><b>${POL_NIV[d.niveau]}</b></div></div>
  ${d.description?`<p>${esc(d.description)}</p>`:''}
  ${v.fichier?`<div class="pol-file"><div><b>${esc(v.fichier.nom)}</b><br><span class="muted">${taille(v.fichier.taille)}</span></div><div class="row">${/pdf/i.test(v.fichier.type)?`<button class="btn ghost sm" data-act="polVoirPdf" data-id="${d.id}">Afficher le PDF</button>`:''}${d.dl?`<button class="btn sm" data-act="polDl" data-id="${d.id}">Télécharger</button>`:'<span class="tag">Consultation seule, téléchargement non autorisé</span>'}</div></div><div id="pdfZone"></div>`:''}
  ${v.texte?`<div class="pol-texte">${LN(v.texte).map(t=>`<p>${esc(t)}</p>`).join('')}</div>`:''}
  ${!v.texte&&!v.fichier?'<p class="empty">Aucun contenu.</p>':''}
  ${!v.fichier&&v.texte&&d.dl?`<p><button class="btn ghost sm" data-act="polDl" data-id="${d.id}">Télécharger (document Word)</button></p>`:''}
 </article>
 ${d.obligatoire&&polCible(d,me)?`<section class="card pol-ack">${req?`<h3>Confirmation de lecture obligatoire</h3><p>En confirmant, vous attestez avoir lu et compris la ${vLib(v)} de ce document et vous engagez à l'appliquer. Votre nom, la version et la date seront enregistrés.</p><button class="btn" data-act="polAck" data-id="${d.id}">J'ai lu et pris connaissance de ce document</button>`:`<p><span class="tag ok">Lecture confirmée</span> le ${new Date(ac.date).toLocaleString('fr-FR')} (version ${esc(ac.version)}).</p>`}</section>`:''}
 ${hist.length>1?`<section class="card"><h3>Historique des versions</h3>${polT(['Version','Approuvée le','En vigueur le','Statut','Note'],hist.map(x=>[x.v,fmtD(x.dateApp),fmtD(x.dateEffet||x.publieLe),POL_VST[x.statut][0],x.note||'']))}</section>`:''}
 ${polGest()?`<p><button class="btn ghost" data-act="polGerer" data-id="${d.id}">Gérer ce document</button></p>`:''}`}

/* ---------- gestion (administrateurs) ---------- */
function polChampsDoc(d){d=d||{niveau:3,publics:[],habilites:[],projets:[],dl:true};
 const roles=Object.entries(ROLES);
 return `<div class="grid"><div class="field" style="grid-column:span 2"><label>Titre</label><input name="titre" required value="${esc(d.titre||'')}"></div>
  <div class="field"><label>Catégorie</label><select name="categorie">${POL_CAT.map(c=>`<option ${d.categorie===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
  <div class="field"><label>Responsable du document</label><input name="responsable" required placeholder="ex. Responsable administratif" value="${esc(d.responsable||'')}"></div></div>
 <div class="field"><label>Description</label><textarea name="description" rows="2">${esc(d.description||'')}</textarea></div>
 <fieldset class="field"><legend>Niveau de confidentialité</legend>${Object.entries(POL_NIV).map(([k,l])=>`<label class="chk"><input type="radio" name="niveau" value="${k}" ${Number(d.niveau)===Number(k)?'checked':''}> <b>${k}. ${l}</b> <span class="muted">— ${POL_NIV_D[k]}</span></label>`).join('')}</fieldset>
 <fieldset class="field"><legend>Publics concernés <span class="muted">(aucune case cochée = tous ceux du niveau choisi)</span></legend><div class="chks">${roles.map(([r,x])=>`<label class="chk"><input type="checkbox" name="publics" value="${r}" ${(d.publics||[]).includes(r)?'checked':''}> ${esc(x.label)}</label>`).join('')}</div></fieldset>
 <fieldset class="field"><legend>Personnes habilitées <span class="muted">(obligatoire pour le niveau Confidentiel ; le DE y a toujours accès)</span></legend><div class="chks">${S.staff.filter(u=>u.actif&&u.role!=='DE').map(u=>`<label class="chk"><input type="checkbox" name="habilites" value="${u.id}" ${(d.habilites||[]).includes(u.id)?'checked':''}> ${esc(u.nom)} <span class="muted">(${esc(posteLib(u))})</span></label>`).join('')}</div></fieldset>
 <fieldset class="field"><legend>Projets pour lesquels ce document s'applique <span class="muted">(facultatif : il s'affichera dans ces projets)</span></legend><div class="chks">${S.projets.map(p=>`<label class="chk"><input type="checkbox" name="projets" value="${p.id}" ${(d.projets||[]).includes(p.id)?'checked':''}> ${esc(p.nom)}</label>`).join('')}</div></fieldset>
 <div class="chks"><label class="chk"><input type="checkbox" name="obligatoire" ${d.obligatoire?'checked':''}> Lecture obligatoire avec confirmation</label><label class="chk"><input type="checkbox" name="dl" ${d.dl?'checked':''}> Téléchargement autorisé</label></div>`}
function polChampsVersion(n){return `<div class="grid"><div class="field"><label>Numéro de version</label><input name="v" required value="${esc(n||'1.0')}"></div>
  <div class="field"><label>Date d'approbation</label><input type="date" name="dateApp"></div><div class="field"><label>Date d'entrée en vigueur</label><input type="date" name="dateEffet"></div><div class="field"><label>Date de prochaine révision</label><input type="date" name="dateRev"></div></div>
 <div class="field"><label>Fichier (${POL_EXT.join(', ').toUpperCase()} · ${taille(POL_MAX)} au plus dans ce prototype)</label><input type="file" name="fichier" accept="${POL_EXT.map(e=>'.'+e).join(',')}"></div>
 <div class="field"><label>Texte du document ou résumé (affiché à la lecture, utilisé par la recherche)</label><textarea name="texte" rows="6"></textarea></div>
 <div class="field"><label>Note de version (ce qui change)</label><input name="note"></div>`}
function polGestion(){const l=S.pol.docs.filter(d=>d.org===ORG()&&polVoit(d)),act=l.filter(d=>!d.archive),arc=l.filter(d=>d.archive);
 const row=d=>{const[s,c]=polStatutDoc(d),v=vCour(d)||vDern(d);return `<tr><td><button class="lnk" data-act="polGerer" data-id="${d.id}">${esc(d.titre)}</button></td><td>${esc(d.categorie)}</td><td>${POL_NIV[d.niveau]}</td><td>${esc(v.v)}</td><td><span class="tag ${c}">${s}</span></td><td>${d.obligatoire?'Oui':'Non'}</td></tr>`};
 return `<details class="card" ${S.pol.docs.length?'':'open'}><summary><b>Ajouter un document</b></summary><form data-form="polDoc" style="margin-top:.8rem">${polChampsDoc()}<h4>Première version</h4>${polChampsVersion('1.0')}
  <p class="muted">Le document est enregistré comme brouillon. Il doit être approuvé par le Directeur exécutif avant d'être publié.</p><button class="btn" type="submit">Enregistrer le brouillon</button></form></details>
 <section class="card"><h3>Documents actifs (${act.length})</h3>${act.length?`<div class="tbl"><table><thead><tr><th>Titre</th><th>Catégorie</th><th>Accès</th><th>Version</th><th>Statut</th><th>Lecture obligatoire</th></tr></thead><tbody>${act.map(row).join('')}</tbody></table></div>`:'<p class="empty">Aucun document.</p>'}</section>

function polFicheGestion(d){const l=vDern(d),pi=vPub(d),aud=polAudience(d),ok=aud.filter(u=>polAccuse(d,u)).length,isDE=me.role==='DE';

 ${pi>=0&&d.obligatoire&&!d.archive?`<section class="card"><h3>Confirmations de lecture</h3><div class="kpis"><div class="kpi"><b>${ok} / ${aud.length}</b><span>personnes ont confirmé</span></div><div class="kpi"><b>${aud.length?Math.round(ok/aud.length*100)+' %':'—'}</b><span>taux de confirmation</span></div></div>
  ${aud.length-ok?`<p><button class="btn ghost" data-act="polRappel" data-id="${d.id}">Envoyer un rappel aux ${aud.length-ok} personne(s) en retard</button></p>`:''}${polTableAud(d)}</section>`:''}
 ${!d.archive&&['publiee','remplacee'].includes(l.statut)?`<details class="card"><summary><b>Ajouter une nouvelle version</b></summary><form data-form="polVer" data-id="${d.id}" style="margin-top:.8rem">${polChampsVersion(polVersionSuiv(l.v))}
  <label class="chk"><input type="checkbox" name="reack" checked> Version majeure : redemander la confirmation de lecture à tout le monde</label><p class="muted">La version actuelle reste en vigueur jusqu'à la publication de la nouvelle.</p><button class="btn" type="submit">Enregistrer le brouillon de version</button></form></details>`:''}
 <details class="card"><summary><b>Modifier les informations et les accès</b></summary><form data-form="polMeta" data-id="${d.id}" style="margin-top:.8rem">${polChampsDoc(d)}<button class="btn" type="submit">Enregistrer</button></form></details>

 <section class="card"><h3>Toutes les versions</h3>${polT(['Version','Statut','Fichier','Approuvée le','En vigueur le','Révision le','Confirmation redemandée','Note'],d.versions.slice().reverse().map(x=>[x.v,POL_VST[x.statut][0],x.fichier?x.fichier.nom:'—',fmtD(x.dateApp),fmtD(x.dateEffet||x.publieLe),fmtD(x.dateRev),x.reack?'Oui':'Non',x.note||'']))}</section>

function polTableAud(d){const aud=polAudience(d);if(!aud.length)return '<p class="empty">Personne n\'est concerné par ce document.</p>';

function polStats(){const ob=S.pol.docs.filter(d=>d.org===ORG()&&!d.archive&&vPub(d)>=0&&d.obligatoire&&polVoit(d));
 const lignes=ob.map(d=>{const a=polAudience(d),c=a.filter(u=>polAccuse(d,u)).length;return {d,a:a.length,c,m:a.length-c}});
 const tA=lignes.reduce((s,x)=>s+x.a,0),tC=lignes.reduce((s,x)=>s+x.c,0);
 const pub=S.pol.docs.filter(d=>d.org===ORG()&&!d.archive&&vPub(d)>=0).length,aApp=S.pol.docs.filter(d=>!d.archive&&vDern(d).statut==='approbation').length,aRev=S.pol.docs.filter(d=>{const v=vCour(d);return !d.archive&&v&&v.dateRev&&v.dateRev<=today()}).length;
 return {lignes,tA,tC,pub,aApp,aRev,taux:tA?Math.round(tC/tA*100):null}}
function polSuivi(){const s=polStats();
 const parRole=Object.keys(ROLES).map(r=>{let a=0,c=0;s.lignes.forEach(x=>polAudience(x.d).filter(u=>u.role===r).forEach(u=>{a++;if(polAccuse(x.d,u))c++}));return [ROLES[r].label,a,c,a-c,a?Math.round(c/a*100)+' %':'—']}).filter(x=>x[1]);
 const retard=S.staff.filter(u=>accesOK(u)).map(u=>[u,polEnAttente(u)]).filter(x=>x[1].length).sort((a,b)=>b[1].length-a[1].length);
 return `<div class="kpis"><div class="kpi"><b>${s.pub}</b><span>documents en vigueur</span></div><div class="kpi"><b>${s.lignes.length}</b><span>à lecture obligatoire</span></div><div class="kpi"><b>${s.taux===null?'—':s.taux+' %'}</b><span>des confirmations attendues sont faites (${s.tC} / ${s.tA})</span></div><div class="kpi"><b>${s.tA-s.tC}</b><span>confirmations manquantes</span></div><div class="kpi"><b>${s.aApp}</b><span>versions en attente d'approbation</span></div><div class="kpi"><b>${s.aRev}</b><span>documents dont la date de révision est passée</span></div></div>
 <section class="card"><div class="row" style="justify-content:space-between"><h3>Par document</h3>${polGest()?'<button class="btn ghost sm" data-act="polCsv">Télécharger (Excel)</button>':''}</div>${s.lignes.length?polT(['Document','Personnes concernées','Ont confirmé','Manquants','Taux'],s.lignes.map(x=>[x.d.titre,x.a,x.c,x.m,x.a?Math.round(x.c/x.a*100)+' %':'—']),['Total',s.tA,s.tC,s.tA-s.tC,s.taux===null?'—':s.taux+' %']):'<p class="empty">Aucun document à lecture obligatoire n\'est en vigueur.</p>'}</section>
 ${parRole.length?`<section class="card"><h3>Par niveau d'accès</h3>${polT(['Niveau','Confirmations attendues','Faites','Manquantes','Taux'],parRole)}</section>`:''}
 ${retard.length?`<section class="card"><div class="row" style="justify-content:space-between"><h3>Personnes en retard (${retard.length})</h3>${polGest()?'<button class="btn ghost sm" data-act="polRappelTous">Relancer tout le monde</button>':''}</div>${polT(['Personne','Poste','Documents non confirmés'],retard.map(([u,l])=>[u.nom,posteLib(u),l.map(d=>d.titre).join(' ; ')]))}</section>`:''}`}
function polCarteDE(){const s=polStats();

/* ---------- fichiers ---------- */
function polLireFichier(file){return new Promise((ok,ko)=>{if(!file||!file.size)return ok(null);
 const ext=file.name.split('.').pop().toLowerCase();if(!POL_EXT.includes(ext))return ko(`Format .${ext} non autorisé. Formats acceptés : ${POL_EXT.join(', ')}.`);
 if(file.size>POL_MAX)return ko(`Fichier trop lourd (${taille(file.size)}). Dans ce prototype, la limite est de ${taille(POL_MAX)} par fichier. Le serveur sécurisé lèvera cette limite.`);
 const r=new FileReader();r.onload=()=>ok({nom:file.name,type:file.type||ext,taille:file.size,data:r.result});r.onerror=()=>ko('Lecture du fichier impossible.');r.readAsDataURL(file)})}
function polBlob(fi){const[h,b]=fi.data.split(',');const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream'})}
function polSauver(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}
async function polTelecharger(d){const v=vCour(d);if(!v||!d.dl)return;
 let nom,data,type;
 if(v.fichier){nom=v.fichier.nom;data=polBlob(v.fichier);type=data.type}
 else{const css='body{font-family:Cambria,Georgia,serif;font-size:11pt}h1{font-size:15pt;text-align:center}img{width:80px;height:80px}table{border-collapse:collapse}td{border:1px solid #999;padding:3pt 6pt;font-size:10pt}';
  nom=`${d.titre.replace(/[^A-Za-z0-9À-ÿ]+/g,'_').slice(0,60)}_v${v.v}.doc`;type='application/msword';
  data=`<html><head><meta charset="utf-8"><style>${css}</style></head><body><p><img src="${LOGO}" alt="Logo"></p><p>${esc(S.org.nom)}</p><h1>${esc(d.titre)}</h1><table><tr><td>Catégorie</td><td>${esc(d.categorie)}</td></tr><tr><td>Version</td><td>${esc(v.v)}</td></tr><tr><td>Approuvée le</td><td>${fmtD(v.dateApp)}</td></tr><tr><td>En vigueur le</td><td>${fmtD(v.dateEffet||v.publieLe)}</td></tr><tr><td>Responsable</td><td>${esc(d.responsable||'')}</td></tr></table>${LN(v.texte).map(t=>`<p>${esc(t)}</p>`).join('')}</body></html>`}
 if(me)log(`Document téléchargé : ${d.titre} (v${v.v})`);
 let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
 if(dl){let n2=nom.replace(/\.doc$/,'.html');try{await dl.save({filename:n2,data});return}catch(e){if(e&&e.code==='declined')return;if(!(e&&['rejected_extension','extension_not_enabled','unavailable','not_granted'].includes(e.code))){alert('Téléchargement impossible ici.');return}}}
 fichierLien(nom,data,type)}
function polCsv(){const s=polStats(),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',L=[['Suivi des confirmations de lecture'],[S.org.nom],['Établi le',new Date().toLocaleString('fr-FR'),'par',me.nom],[],['Document','Version en vigueur','Personnes concernées','Ont confirmé','Manquants','Taux']];
 s.lignes.forEach(x=>L.push([x.d.titre,vCour(x.d).v,x.a,x.c,x.m,x.a?Math.round(x.c/x.a*100)+' %':'']));L.push([],['Détail par personne'],['Document','Personne','Poste','Statut','Version confirmée','Date']);
 s.lignes.forEach(x=>polAudience(x.d).forEach(u=>{const a=polAccuse(x.d,u);L.push([x.d.titre,u.nom,posteLib(u),a?'Confirmé':'En attente',a?a.version:'',a?new Date(a.date).toLocaleString('fr-FR'):''])}));
 fichier(`Suivi_politiques_${today()}.csv`,'﻿'+L.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8');log('Suivi des politiques téléchargé (Excel)')}

function polLireMeta(f){const fd=new FormData(f),g=k=>fd.getAll(k);

async function polLireVersion(f){const fd=new FormData(f);const fichierObj=await polLireFichier(fd.get('fichier'));
 const texte=String(fd.get('texte')||'').trim();if(!fichierObj&&!texte)throw 'Ajoutez un fichier ou saisissez le texte du document.';
 return {v:String(fd.get('v')).trim(),dateApp:fd.get('dateApp')||'',dateEffet:fd.get('dateEffet')||'',dateRev:fd.get('dateRev')||'',texte,note:String(fd.get('note')||'').trim(),fichier:fichierObj,statut:'brouillon',auteurId:me.id,cree:today()}}
document.addEventListener('submit',async e=>{const f=e.target,t=f.dataset&&f.dataset.form;if(!t||!t.startsWith('pol'))return;
 e.preventDefault();e.stopImmediatePropagation();if(!me)return;
 const d=S.pol.docs.find(x=>x.id===f.dataset.id);
 if(t==='polMsg'){const fd=new FormData(f),dv=fd.get('dest'),aud=polAudience(d);let dest=dv==='tous'?aud:dv==='retard'?aud.filter(u=>!polAccuse(d,u)):aud.filter(u=>u.role===dv.slice(5));
  const n=polNotifier(d,dest.map(u=>u.id),`${d.titre} : ${String(fd.get('texte')).trim()}`);log(`Notification envoyée (${n} destinataire(s)) : ${d.titre}`);save();alert(`Notification envoyée à ${n} personne(s).`);render();return}
 if(!polGest())return;

 let v;try{v=await polLireVersion(f)}catch(err){alert(err);return}
 if(t==='polDoc'){const m=polLireMeta(f);if(!polCtrlMeta(m))return;
  const nd={id:uid(),org:ORG(),...m,archive:false,creeLe:today(),auteurId:me.id,versions:[{...v,reack:true}]};S.pol.docs.unshift(nd);
  if(!polSauver()){S.pol.docs.shift();alert('Espace de stockage du navigateur plein : le fichier est trop lourd pour ce prototype. Enregistrez une version plus légère ou seulement le texte.');return}
  log(`Politique créée (brouillon) : ${nd.titre}`);polEdit=nd.id}
 if(t==='polVer'){if(d.versions.some(x=>x.v===v.v)){alert('Ce numéro de version existe déjà.');return}
  v.reack=!!new FormData(f).get('reack');d.versions.push(v);
  if(!polSauver()){d.versions.pop();alert('Espace de stockage du navigateur plein : le fichier est trop lourd pour ce prototype.');return}
  log(`Nouvelle version ${v.v} en brouillon : ${d.titre}`)}
 save();render();window.scrollTo(0,0)});

 if(a==='polAck'&&d&&polDoitConfirmer(d)){const v=vCour(d);S.pol.accuses.push({id:uid(),docId:d.id,vIdx:vPub(d),version:v.v,userId:me.id,date:new Date().toISOString()});log(`Lecture confirmée : ${d.titre} (v${v.v})`);save();render()}
 if(!polGest()&&!['notifLu','notifOuvrir'].includes(a))return;
 if(a==='polStatut'&&d){const l=vDern(d),to=b.dataset.v;if(to==='approuvee'&&me.role!=='DE')return;
  l.statut=to;if(to==='approuvee'){l.dateApp=l.dateApp||today();l.approuvePar=me.id}
  if(to==='approbation')polNotifier(d,S.staff.filter(u=>u.role==='DE'&&accesOK(u)).map(u=>u.id),`À approuver : ${d.titre} (version ${l.v})`);
  log(`Politique « ${d.titre} » v${l.v} : ${POL_VST[to][0].toLowerCase()}`);save();render()}
 if(a==='polPublier'&&d){const l=vDern(d);if(l.statut!=='approuvee')return;
  d.versions.forEach(x=>{if(x.statut==='publiee')x.statut='remplacee'});l.statut='publiee';l.publieLe=today();l.dateEffet=l.dateEffet||today();
  let n=0;if(document.getElementById('polNotif')?.checked)n=polNotifier(d,polAudience(d).map(u=>u.id),`${d.obligatoire&&l.reack?'Lecture obligatoire : ':'Nouveau : '}${d.titre} (version ${l.v})`);
  log(`Politique publiée : ${d.titre} v${l.v}${n?` · ${n} personne(s) prévenue(s)`:''}`);save();render()}
 if(a==='polArchive'&&d){const on=b.dataset.v==='1';if(on&&!confirm('Archiver ce document ? Il disparaîtra de la bibliothèque mais restera dans les archives.'))return;d.archive=on;log(`Politique ${on?'archivée':'restaurée'} : ${d.titre}`);save();render()}
 if(a==='polRappel'&&d){const m=polAudience(d).filter(u=>!polAccuse(d,u));const n=polNotifier(d,m.map(u=>u.id),`Rappel : merci de lire et de confirmer « ${d.titre} »`);log(`Rappel envoyé (${n}) : ${d.titre}`);save();alert(`Rappel envoyé à ${n} personne(s).`);render()}
 if(a==='polRappelTous'){let n=0;polStats().lignes.forEach(x=>{n+=polNotifier(x.d,polAudience(x.d).filter(u=>!polAccuse(x.d,u)).map(u=>u.id),`Rappel : merci de lire et de confirmer « ${x.d.titre} »`)});log(`Rappels envoyés (${n})`);save();alert(`${n} rappel(s) envoyé(s).`);render()}
 if(a==='polCsv')polCsv();
 if(a==='notifLu'){mesNotifs().forEach(n=>n.lus.push(me.id));save();render()}
 if(a==='notifOuvrir'){const n=S.pol.notifs.find(x=>x.id===b.dataset.id);if(!n)return;n.lus.push(me.id);save();if(n.lien){ouvrirLien(n);return}const dd=S.pol.docs.find(x=>x.id===n.docId);
  view='politiques';if(dd&&polGest()&&vDern(dd).statut!=='publiee'&&n.texte.startsWith('À approuver')){polEdit=dd.id;polDoc=null}else{polDoc=dd?dd.id:null;polEdit=null}render();window.scrollTo(0,0)}
});

/* recherche et filtre sans recharger l'écran */
function polFiltrer(){const q=(document.getElementById('polQ')?.value||'').trim().toLowerCase(),c=document.getElementById('polC')?.value||'';let n=0;
 document.querySelectorAll('.pol-cat').forEach(s=>{let k=0;s.querySelectorAll('.pol-item').forEach(i=>{const ok=(!q||i.dataset.q.includes(q))&&(!c||i.dataset.c===c);i.hidden=!ok;if(ok)k++});s.hidden=!k;n+=k});
 const nb=document.getElementById('polNb');if(nb)nb.textContent=n+' document(s)';const v=document.getElementById('polVide');if(v)v.hidden=n>0}
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('[data-pol-q]'))polFiltrer()});
document.addEventListener('change',e=>{if(e.target.matches&&e.target.matches('[data-pol-c]'))polFiltrer()});

/* ===== Mon espace : feuille de route individuelle, tâches, observations ===== */
const SUP_DEF={ASC:'SUP',SUP:'SE',SE:'CP',LECT:'CP',CP:'DP',DP:'DE',RA:'DE',RH:'DE',DE:'CA'};
const FDR_ST={brouillon:['En élaboration',''],soumise:['Soumise au responsable','warn'],a_revoir:['À corriger','bad'],validee:['Validée','ok']};
const T_ST=['À faire','En cours','Terminée','Bloquée'];
let moiUser=null,moiTab='bord';
function ensureMoi(){S.fdr=S.fdr||[];S.obs=S.obs||[];
 if(!S.supInit){S.supInit=true;S.staff.forEach(u=>{if(u.supId!==undefined)return;const r=SUP_DEF[u.role];const s=r&&S.staff.find(x=>x.role===r&&x.actif&&x.id!==u.id);u.supId=s?s.id:''})}}
const sup=u=>S.staff.find(x=>x.id===u.supId);
const subs=u=>S.staff.filter(x=>x.supId===u.id&&x.actif);
/* la personne connectée est-elle au-dessus de u dans la chaîne hiérarchique ? */
function auDessus(u,moi=me){let c=sup(u),n=0;while(c&&n<20){if(c.id===moi.id)return true;c=sup(c);n++}return false}
const voitPerso=u=>u.id===me.id||auDessus(u)||['DE','RH'].includes(me.role);
const peutValider=u=>u.id!==me.id&&(auDessus(u)||me.role==='DE');
const equipeVue=()=>S.staff.filter(u=>u.actif&&u.id!==me.id&&u.role!=='EXT'&&(auDessus(u)||['DE','RH'].includes(me.role)));
function fdrDe(u,creer){let f=S.fdr.filter(x=>x.userId===u.id).sort((a,b)=>b.cree.localeCompare(a.cree))[0];
 if(!f&&creer){const an=new Date().getFullYear();f={id:uid(),userId:u.id,du:`${an}-01-01`,au:`${an}-12-31`,fiche:'',resp:'',statut:'brouillon',objectifs:[],taches:[],discussion:[],histo:[{date:new Date().toISOString(),par:me.id,texte:'Feuille de route créée'}],cree:new Date().toISOString()};S.fdr.push(f)}return f}
const enRetard=t=>t.statut!=='Terminée'&&t.echeance&&t.echeance<today();
const dernierAv=t=>(t.majs&&t.majs.length?t.majs[t.majs.length-1].avancement:0)||0;
function statsFdr(f){if(!f)return null;const t=f.taches,n=t.length,fait=t.filter(x=>x.statut==='Terminée'),ret=t.filter(enRetard),ech=fait.filter(x=>x.echeance);
 const aTemps=ech.filter(x=>x.termineLe&&x.termineLe<=x.echeance).length,obj=f.objectifs.filter(o=>nb(o.cible)>0);
 return {n,fait:fait.length,ret:ret.length,taux:n?Math.round(fait.length/n*100):null,av:n?Math.round(t.reduce((s,x)=>s+(x.statut==='Terminée'?100:dernierAv(x)),0)/n):null,
  delais:ech.length?Math.round(aTemps/ech.length*100):null,nEch:ech.length,
  obj:obj.length?Math.round(obj.reduce((s,o)=>s+Math.min(100,nb(o.realise)/nb(o.cible)*100),0)/obj.length):null}}
function notifier(dest,texte,lien,ref){dest=[...new Set(dest.filter(Boolean))].filter(id=>id!==me.id);if(!dest.length)return 0;S.pol.notifs.unshift({id:uid(),docId:null,lien,ref,date:new Date().toISOString(),texte,dest,lus:[]});S.pol.notifs=S.pol.notifs.slice(0,300);return dest.length}
function histo(f,texte){f.histo.push({date:new Date().toISOString(),par:me.id,texte})}
const obsOuvertes=u=>S.obs.filter(o=>o.userId===u.id&&o.statut==='ouverte');
const fdrAValider=()=>equipeVue().filter(u=>peutValider(u)).map(u=>fdrDe(u)).filter(f=>f&&f.statut==='soumise');
const moiBadge=()=>{const f=fdrDe(me),s=statsFdr(f);return (s?s.ret:0)+obsOuvertes(me).filter(o=>o.type==='correction').length+fdrAValider().length};
const dt=d=>new Date(d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});

function moi(){
 if(moiUser&&moiUser!==me.id){const u=S.staff.find(x=>x.id===moiUser);if(u&&voitPerso(u))return fdrEcran(u);moiUser=null}
 const tabs=[['bord','Mon tableau de bord'],['fdr','Ma feuille de route'],['obs',`Observations${obsOuvertes(me).length?` <span class="badge">${obsOuvertes(me).length}</span>`:''}`]];
 if(equipeVue().length)tabs.push(['equipe',`Mon équipe${fdrAValider().length?` <span class="badge">${fdrAValider().length}</span>`:''}`]);
 if(!tabs.some(t=>t[0]===moiTab))moiTab='bord';
 return head('Mon espace',`${esc(me.nom)} · ${esc(posteLib(me))}${sup(me)?` · responsable : ${esc(sup(me).nom)}`:''}`)+
 `<nav class="subnav minor">${tabs.map(([k,l])=>`<button data-act="moiTab" data-v="${k}" ${moiTab===k?'aria-current="page"':''}>${l}</button>`).join('')}</nav>`+
 ({bord:moiBord,fdr:()=>fdrEcran(me),obs:moiObs,equipe:moiEquipe}[moiTab])()}

function moiBord(){const f=fdrDe(me),s=statsFdr(f),obs=obsOuvertes(me),pol=polEnAttente(),t=f?f.taches:[];
 const proch=t.filter(x=>x.statut!=='Terminée'&&x.echeance&&x.echeance>=today()).sort((a,b)=>a.echeance.localeCompare(b.echeance)).slice(0,6),ret=t.filter(enRetard);
 const attente=[];if(f&&f.statut==='soumise')attente.push(['Feuille de route',FDR_ST.soumise[0],fmtD(f.soumiseLe)]);
 const k=s&&s.n?[[`${s.fait} / ${s.n}`,'tâches réalisées'],[s.av+' %','avancement moyen de mes tâches'],[s.ret,'tâches en retard'],[s.obj===null?'—':s.obj+' %','atteinte moyenne de mes objectifs'],[obs.length,'observations ouvertes'],[pol.length,'lectures obligatoires à confirmer']]:null;
 return (!f?`<section class="card"><h3>Feuille de route</h3><p>Vous n'avez pas encore de feuille de route. Elle rassemble votre fiche de poste, vos objectifs, vos tâches, vos indicateurs et vos échéances.</p><button class="btn" data-act="fdrCreer">Élaborer ma feuille de route</button></section>`:'')+
 (k?`<div class="kpis">${k.map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`:f?`<section class="card"><p class="empty">Aucune tâche dans votre feuille de route pour l'instant : les indicateurs s'afficheront dès qu'elle en contiendra.</p><button class="btn ghost sm" data-act="moiTab" data-v="fdr">Compléter ma feuille de route</button></section>`:'')+
 (ret.length?`<section class="card"><h3>Tâches en retard (${ret.length})</h3>${tacheListe(ret,f,true)}</section>`:'')+
 (proch.length?`<section class="card"><h3>Prochaines échéances</h3>${tacheListe(proch,f,true)}</section>`:'')+
 (f&&f.objectifs.length?`<section class="card"><h3>Mes indicateurs individuels</h3>${objBarres(f)}</section>`:'')+
 (obs.length?`<section class="card"><h3>Observations de mon responsable (${obs.length})</h3>${obsListe(obs,true)}</section>`:'')+
 (attente.length?`<section class="card"><h3>Mes documents en attente de validation</h3>${polT(['Document','Statut','Soumis le'],attente)}</section>`:'')+
 (pol.length?`<section class="card"><h3>Lectures obligatoires à confirmer (${pol.length})</h3><div class="pol-list">${pol.map(polCarte).join('')}</div></section>`:'')}

function objBarres(f){return f.objectifs.map(o=>{const c=nb(o.cible),r=nb(o.realise),p=c?Math.min(100,Math.round(r/c*100)):null;
 return `<div class="ind"><div>${esc(o.libelle)}${o.indicateur?`<br><span class="muted">${esc(o.indicateur)}</span>`:''}<div class="bar"><i style="width:${p||0}%"></i></div></div><div class="num">${c?`${fmtN(r)} / ${fmtN(c)} ${esc(o.unite||'')}<br><span class="muted">${p} %</span>`:'<span class="muted">cible non définie</span>'}${o.echeance?`<br><span class="muted">échéance ${fmtD(o.echeance)}</span>`:''}</div></div>`}).join('')}
function tacheListe(l,f,court){return `<div class="tbl"><table><thead><tr><th>Tâche</th><th>Échéance</th><th>Livrable</th><th>Statut</th><th>Avancement</th></tr></thead><tbody>${l.map(t=>`<tr><td>${esc(t.libelle)}${t.apres?' <span class="tag">ajoutée après validation</span>':''}</td><td>${fmtD(t.echeance)}${enRetard(t)?' <span class="tag bad">en retard</span>':''}</td><td>${esc(t.livrable||'—')}</td><td>${esc(t.statut)}</td><td class="num">${t.statut==='Terminée'?100:dernierAv(t)} %</td></tr>`).join('')}</tbody></table></div>${court?`<p><button class="btn ghost sm" data-act="moiTab" data-v="fdr">Mettre à jour mes tâches</button></p>`:''}`}
function obsListe(l,moiMeme){return l.map(o=>`<div class="obs ${o.type==='correction'?'corr':''}"><p class="muted" style="margin:0">${o.type==='correction'?'<b>Demande de correction</b>':'<b>Observation</b>'} · ${esc(who(o.par))} · ${dt(o.date)}${o.statut==='traitée'?' · <span class="tag ok">traitée</span>':''}</p><p>${esc(o.texte)}</p>
 ${o.reponse?`<p class="muted">Réponse du ${dt(o.repondueLe)} : ${esc(o.reponse)}</p>`:''}
 ${moiMeme&&o.statut==='ouverte'?`<form data-form="obsRep" data-id="${o.id}" class="row"><input name="reponse" placeholder="Votre réponse (facultatif)" aria-label="Votre réponse" style="flex:1;min-width:12rem"><button class="btn sm" type="submit">Marquer comme traitée</button></form>`:''}</div>`).join('')}
function moiObs(){const l=S.obs.filter(o=>o.userId===me.id).sort((a,b)=>b.date.localeCompare(a.date));
 return `<section class="card"><h3>Observations et demandes de correction reçues</h3>${l.length?obsListe(l,true):'<p class="empty">Aucune observation pour le moment.</p>'}</section>`}
function moiEquipe(){const l=equipeVue();
 return `<section class="card"><h3>Feuilles de route de mon périmètre (${l.length})</h3><p class="muted">Personnes placées sous votre responsabilité, directement ou indirectement${['DE','RH'].includes(me.role)?', et tout le personnel pour la Direction et les RH':''}.</p><div class="tbl"><table><thead><tr><th>Personne</th><th>Poste</th><th>Responsable direct</th><th>Feuille de route</th><th>Tâches réalisées</th><th>En retard</th><th>Atteinte des objectifs</th><th></th></tr></thead><tbody>
 ${l.map(u=>{const f=fdrDe(u),s=statsFdr(f);return `<tr><td>${esc(u.nom)}</td><td>${esc(posteLib(u))}</td><td>${sup(u)?esc(sup(u).nom):'—'}</td><td>${f?`<span class="tag ${FDR_ST[f.statut][1]}">${FDR_ST[f.statut][0]}</span>`:'<span class="muted">non élaborée</span>'}</td><td class="num">${s&&s.n?`${s.fait} / ${s.n}`:'—'}</td><td class="num">${s&&s.n?s.ret:'—'}</td><td class="num">${s&&s.obj!==null?s.obj+' %':'—'}</td><td><button class="btn ghost sm" data-act="moiVoir" data-id="${u.id}">Ouvrir</button></td></tr>`}).join('')}</tbody></table></div></section>`}

/* ---------- écran de la feuille de route ---------- */
function fdrEcran(u){const f=fdrDe(u),self=u.id===me.id,val=peutValider(u);
 const crumb=self?'':`<p class="crumb"><button class="lnk" data-act="moiRetour">Mon espace</button> › <span>Mon équipe</span> › <b>${esc(u.nom)}</b></p>`;
 if(!f)return crumb+(self?'':head('Feuille de route de '+esc(u.nom),''))+`<section class="card"><p class="empty">${self?'Vous n\'avez pas encore de feuille de route.':'Cette personne n\'a pas encore élaboré sa feuille de route.'}</p>${self||val?`<button class="btn" data-act="fdrCreer" data-id="${u.id}">${self?'Élaborer ma feuille de route':'Lui préparer une feuille de route'}</button>`:''}</section>`;
 const ed=(self||val)&&['brouillon','a_revoir'].includes(f.statut),s=statsFdr(f),[st,sc]=FDR_ST[f.statut];
 let actions='';

 if(val&&f.statut==='soumise')actions+=`<button class="btn" data-act="fdrValider" data-id="${f.id}">Valider la feuille de route</button>`;
 if(val&&f.statut==='validee')actions+=`<button class="btn ghost" data-act="fdrRouvrir" data-id="${f.id}">Rouvrir pour révision</button>`;
 return crumb+(self?'':head('Feuille de route de '+esc(u.nom),esc(posteLib(u))))+
 `<section class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3 style="margin:0">Feuille de route du ${fmtD(f.du)} au ${fmtD(f.au)}</h3><p class="muted" style="margin:.3rem 0 0">${esc(posteLib(u))} · responsable hiérarchique : ${sup(u)?esc(sup(u).nom):'non défini'}</p></div><div><span class="tag ${sc}">${st}</span>${f.valideLe?` <span class="muted">le ${fmtD(f.valideLe)} par ${esc(who(f.validePar))}</span>`:''}</div></div>
  ${f.statut==='a_revoir'?'<p class="note">Votre responsable a demandé des corrections : voir la discussion ci-dessous, corrigez puis soumettez à nouveau.</p>':''}
  <div class="row" style="margin-top:.8rem">${actions}<button class="btn ghost sm" data-act="fdrPrint" data-id="${f.id}">Imprimer / PDF</button><button class="btn ghost sm" data-act="fdrWord" data-id="${f.id}">Word</button></div></section>
 ${s.n?`<div class="kpis"><div class="kpi"><b>${s.fait} / ${s.n}</b><span>tâches réalisées</span></div><div class="kpi"><b>${s.av} %</b><span>avancement moyen</span></div><div class="kpi"><b>${s.ret}</b><span>en retard</span></div><div class="kpi"><b>${s.obj===null?'—':s.obj+' %'}</b><span>atteinte des objectifs</span></div></div>`:''}
 <form class="card" data-form="fdrMeta" data-id="${f.id}"><h3>Poste et responsabilités</h3><div class="grid"><div class="field"><label>Début de la période</label><input type="date" name="du" value="${f.du}" ${ed?'':'disabled'} required></div><div class="field"><label>Fin de la période</label><input type="date" name="au" value="${f.au}" ${ed?'':'disabled'} required></div></div>
  <div class="field"><label>Fiche de poste : missions principales (une par ligne)</label><textarea name="fiche" rows="4" ${ed?'':'disabled'}>${esc(f.fiche)}</textarea></div>
  <div class="field"><label>Responsabilités (une par ligne)</label><textarea name="resp" rows="4" ${ed?'':'disabled'}>${esc(f.resp)}</textarea></div>${ed?'<button class="btn ghost sm" type="submit">Enregistrer</button>':''}</form>
 <section class="card"><h3>Objectifs individuels et indicateurs</h3>${f.objectifs.length?`<div class="tbl"><table><thead><tr><th>Objectif</th><th>Indicateur</th><th>Cible</th><th>Réalisé</th><th>Échéance</th><th>Taux</th>${ed?'<th></th>':''}</tr></thead><tbody>${f.objectifs.map(o=>{const c=nb(o.cible);return `<tr><td>${esc(o.libelle)}</td><td>${esc(o.indicateur||'—')}</td><td class="num">${c?fmtN(c)+' '+esc(o.unite||''):'—'}</td><td class="num">${fmtN(nb(o.realise))}${o.majLe?`<br><span class="muted">au ${fmtD(o.majLe)}</span>`:''}</td><td>${fmtD(o.echeance)}</td><td class="num">${c?Math.min(100,Math.round(nb(o.realise)/c*100))+' %':'—'}</td>${ed?`<td><button class="btn danger sm" data-act="fdrDelObj" data-f="${f.id}" data-id="${o.id}">Retirer</button></td>`:''}</tr>`}).join('')}</tbody></table></div>`:'<p class="empty">Aucun objectif.</p>'}

async function api(path,{method='GET',body,headers={},anon=false,raw=false}={}){
 if(sess&&!anon&&sess.expires_at&&sess.expires_at*1000-Date.now()<60000)await authRefresh();
 const h={apikey:SUPA.key,...headers};if(sess&&!anon)h.Authorization='Bearer '+sess.access_token;
 if(body!==undefined&&!(body instanceof Blob)&&!h['Content-Type'])h['Content-Type']='application/json';
 let r;try{r=await fetch(SUPA.url+path,{method,headers:h,body:body===undefined?undefined:(body instanceof Blob?body:JSON.stringify(body))})}
 catch(e){throw new Error('Serveur injoignable. Vérifiez la connexion Internet puis réessayez.')}
 if(raw){if(!r.ok)throw new Error(await errTexte(r));return r}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){if(r.status===401&&sess&&!anon){sessEcrire(null);me=null}throw new Error(errMsg(j,r.status))}
 return j}

 if(/Invalid login credentials/i.test(m))return 'Adresse e-mail ou mot de passe incorrect.';
 if(/row-level security|permission denied/i.test(m))return 'Action refusée : vos droits ne le permettent pas.';
 if(/duplicate key/i.test(m))return 'Cet élément existe déjà.';

 return m}

 if(a==='rowDel'){const x=curA();(gp(x,b.dataset.path)||[]).splice(Number(b.dataset.i),1);save();render()}
 if(a==='planType'){const p=projAct();PLAN_TYPE.forEach(([t,ex,ph,ti])=>nouvelleActivite(p.id,t,ex,ph,ti));log(`Plan type d'un projet routier créé : ${p.nom}`);save();render()}
 if(a==='delAct'){const x=curA();if(!confirm('Supprimer définitivement cette activité, ses TDR, son rapport et ses dépenses ?'))return;S.activites=S.activites.filter(y=>y!==x);log(`Activité supprimée : ${x.titre}`);actCur=null;save();render()}
 if(a==='validerRap'){const x=curA();x.statut='Rapport validé';log(`Rapport validé : ${x.titre}`);save();render()}
 if(a==='printDoc'){const z=document.createElement('div');z.id='printzone';z.className='doc';z.innerHTML=document.getElementById('doc').innerHTML;document.body.appendChild(z);document.body.classList.add('print-doc');log('Document imprimé');setTimeout(()=>{window.print();setTimeout(()=>{z.remove();document.body.classList.remove('print-doc')},500)},50)}
 if(a==='wordDoc'){const d=document.getElementById('doc');const css=`body{font-family:Cambria,Georgia,'Times New Roman',serif;font-size:11pt;color:#000}h1{font-size:16pt;text-align:center;text-transform:uppercase}h2{font-size:13pt;margin-top:16pt}h3{font-size:12pt}h4,h5{font-size:11pt}table{border-collapse:collapse;width:100%;margin:6pt 0}th,td{border:1px solid #444;padding:3pt 5pt;font-size:10pt;text-align:left}th{background:#eee}img{width:70px;height:70px}.doc-garde{text-align:center}.doc-garde img{width:140px;height:140px}.muted{color:#555}`;
  fichier(`${b.dataset.n}_${(curA()?curA().titre:projAct().nom).replace(/[^A-Za-z0-9À-ÿ]+/g,'_').slice(0,60)}.doc`,`<html><head><meta charset="utf-8"><style>${css}</style></head><body>${d.innerHTML}</body></html>`,'application/msword');log('Document téléchargé (Word)')}
 if(a==='dem'){const d=S.demandes.find(x=>x.id===b.dataset.id);d.statut=b.dataset.to;log(`Demande ${d.statut.toLowerCase()} : ${d.objet}`);render()}
});
document.addEventListener('change',e=>{
 if(e.target.id==='indSel')syncSens();
 if(e.target.classList.contains('affStaff'))syncAff(e.target);
 majBrouillon(e.target);majAct(e.target);
 if(e.target.dataset&&e.target.dataset.actSel==='homeProj'){actProj=e.target.value||null;actCur=null;editForm=null;render()}
 if(e.target.dataset&&e.target.dataset.actSel==='homeActu'){homeActu=e.target.value||null;render()}
 if(e.target.dataset&&e.target.dataset.actSel==='homePol'){homePol=e.target.value||null;render()}
 if(e.target.dataset&&e.target.dataset.actSel==='proj'){actProj=e.target.value;actCur=null;render()}
 if(e.target.dataset&&e.target.dataset.actSel==='phase'){const a=curA();a.phase=Number(e.target.value);save();render()}
});
function syncSens(){const s=document.getElementById('indSel');if(!s)return;const sens=s.selectedOptions[0]?.dataset.s==='1';
 document.getElementById('sensNote').hidden=!sens;document.getElementById('noteWrap').hidden=sens}
document.addEventListener('input',e=>{majBrouillon(e.target);majAct(e.target)});
function majAct(t){if(!me||!t.dataset)return;
 if(t.dataset.path){const a=curA();if(!a)return;let v=t.value;if(t.type==='number')v=v===''?'':Number(v);sp(a,t.dataset.path,v);save()}
 else if(t.dataset.ppath){const p=projAct();if(!p)return;rapportProjet(p)[t.dataset.ppath]=t.value;save()}
 else if(t.dataset.pfield){const p=projAct();p[t.dataset.pfield]=t.value;save()}
 else if(t.dataset.phaseLib){const p=projAct();p.phases=p.phases||{};p.phases[t.dataset.phaseLib]=t.value;save()}
 else if(t.dataset.sec!==undefined){const p=projAct();sectionsDe(p)[Number(t.dataset.sec)][t.dataset.sk]=t.value;save()}
 else if(t.dataset.catdep!==undefined){const p=projAct();p.catDep=t.value;save()}}
function majBrouillon(t){const b=me&&brou();if(!b||!t.dataset)return;
 if(t.dataset.cnt){const parts=[];document.querySelectorAll('[data-cnt]').forEach(x=>{const[s,a]=x.dataset.cnt.split('|'),k=Math.max(0,Math.min(5000,parseInt(x.value)||0));for(let i=0;i<k;i++)parts.push({sexe:s,age:a})});
  b.participants=parts;save();const f=parts.filter(q=>q.sexe==='F').length;document.getElementById('totF').textContent=f;document.getElementById('totH').textContent=parts.length-f;document.getElementById('totAll').textContent=parts.length;return}
 if(t.dataset.bf){b.valeurs[t.dataset.bf]=t.type==='number'?(t.value===''?'':Number(t.value)):t.value;save()}
 else if(t.dataset.bfm){const id=t.dataset.bfm;b.valeurs[id]=[...document.querySelectorAll(`[data-bfm="${id}"]:checked`)].map(x=>x.value);save()}}
function syncAff(s){const po=s.selectedOptions[0]?.dataset.po,t=s.closest('form').querySelector('.affPoste');if(po&&t&&[...t.options].some(o=>o.value===po))t.value=po}
ensureModules();ensurePol();ensureMoi();save();
const _r=render;render=function(){_r();syncSens();document.querySelectorAll('.affStaff').forEach(syncAff)};
srvInit();
</script>
</body>
