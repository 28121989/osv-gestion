<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OSV Gestion — MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F1;--panel:#FFFFFF;--ink:#14231F;--muted:#55665F;--line:#D7DED9;--soft:#E8EEEA;--side:#0F3A33;--side-ink:#E3EEEA;--side-muted:#9DBDB3;--accent:#E9771F;--accent-ink:#1A0E03;--ok:#2E7D4F;--warn:#9A6412;--bad:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1412;--panel:#15201C;--ink:#E2EBE7;--muted:#98AAA3;--line:#2A3834;--soft:#1C2925;--side:#09241F;--ok:#5DBB86;--warn:#E0A84A;--bad:#F08A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1412;--panel:#15201C;--ink:#E2EBE7;--muted:#98AAA3;--line:#2A3834;--soft:#1C2925;--side:#09241F;--ok:#5DBB86;--warn:#E0A84A;--bad:#F08A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-stretch:82%;font-weight:700;line-height:1.15;margin:0}
h1{font-size:1.9rem}h2{font-size:1.3rem}h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:6px;padding:.55rem 1rem;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:.3rem .65rem;font-size:.85rem}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
input,select,textarea{width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.25rem}
.field{margin-bottom:.8rem}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
/* login */
.login{min-height:100%;display:grid;place-items:center;padding:1.5rem}
.login-box{width:100%;max-width:420px}
.brand{display:flex;align-items:center;gap:.6rem;margin-bottom:1.6rem}
.brand-mark{width:14px;height:44px;background:var(--accent)}
.brand small{display:block;color:var(--muted);font-size:.85rem}
.login-box .card{padding:1.5rem}
.err{color:var(--bad);font-size:.88rem;margin-top:.4rem}
details{margin-top:1rem;font-size:.88rem;color:var(--muted)}
details table{margin-top:.5rem}
/* shell */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:1.4rem 1rem;display:flex;flex-direction:column;gap:1.2rem;position:sticky;top:0;height:100vh;height:100dvh}
.who{border-left:6px solid var(--accent);padding-left:.75rem}
.who strong{display:block;font-stretch:85%;font-size:1.1rem}
.who span{color:var(--side-muted);font-size:.85rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:transparent;border:0;color:var(--side-ink);text-align:left;padding:.55rem .7rem;border-radius:6px}
.nav button[aria-current="page"]{background:rgba(255,255,255,.1);box-shadow:inset 3px 0 0 var(--accent)}
.side .foot{margin-top:auto;font-size:.8rem;color:var(--side-muted)}
.side .foot button{color:var(--side-ink);border-color:rgba(255,255,255,.25)}
main{padding:1.8rem clamp(1rem,3vw,2.5rem);min-width:0}
.head{margin-bottom:1.4rem}
.head p{color:var(--muted);margin:.35rem 0 0;max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.2rem;margin-bottom:1rem}
.kpis{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:1rem}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem}
.kpi b{display:block;font-size:2rem;font-stretch:78%;line-height:1}
.kpi span{color:var(--muted);font-size:.85rem}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;color:var(--muted);font-weight:500;padding:.45rem .5rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.55rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
.tag{display:inline-block;font-size:.78rem;padding:.1rem .5rem;border-radius:999px;background:var(--soft);white-space:nowrap}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;margin:.3rem 0}
.bar i{display:block;height:100%;background:var(--ok)}
.ind{display:grid;grid-template-columns:1fr auto;gap:.2rem 1rem;padding:.6rem 0;border-top:1px solid var(--line)}
.ind:first-of-type{border-top:0}
.ind .num{font-stretch:80%;font-weight:600;text-align:right}
.muted{color:var(--muted)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--warn);padding-left:.6rem;margin:.6rem 0}
.empty{color:var(--muted);padding:.6rem 0}
.demo{font-size:.75rem;color:var(--warn)}
.bar{position:relative}.bar.lg{height:14px;border-radius:7px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.bar .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.7}
.strat-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:.8rem}
.score b{display:block;font-size:2.6rem;font-stretch:75%;line-height:1;text-align:right}
.axe{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:.1rem 1rem;padding:.7rem 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.axe:hover{background:var(--soft)}
.axe .num{text-align:right;font-weight:600;font-stretch:80%}
.legend{font-size:.8rem;color:var(--muted);margin-top:.6rem}
.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{display:flex;align-items:center;gap:1rem;padding:.6rem clamp(1rem,3vw,2.5rem)}
.brand-sm{font-stretch:82%;font-size:1.15rem}
.back{background:none;border:0;font-weight:600;padding:.3rem 0;color:var(--ink)}
.back:hover{color:var(--accent)}
.who2{margin-left:auto;font-size:.88rem;color:var(--muted);text-align:right}
.tiles{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.3rem;text-align:left;min-height:130px}
.tile:hover{border-color:var(--accent)}
.tile p{color:var(--muted);margin:.4rem 0 0}
.badge{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:.8rem;border-radius:999px;padding:0 .5rem;vertical-align:middle;font-stretch:100%}
@media (max-width:600px){.who2{display:none}.top-in .btn{margin-left:auto}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem;margin:.2rem 0 .8rem}
.facts div{background:var(--soft);border-radius:8px;padding:.5rem .7rem}.facts span{display:block;font-size:.78rem;color:var(--muted)}
.team{margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--line)}.team h3{margin-bottom:.5rem}
.chip{display:inline-flex;align-items:center;gap:.2rem;background:var(--soft);border-radius:999px;padding:.05rem .55rem;margin:.1rem 0;font-size:.85rem;white-space:nowrap}
.chip .x{background:none;border:0;color:var(--bad);font-weight:700;padding:0 .1rem;line-height:1}
.inl{display:flex;gap:.3rem;min-width:150px}.inl input{width:80px;padding:.3rem .4rem}
@media (max-width:820px){
 .app{grid-template-columns:1fr}
 .side{position:static;height:auto;padding:1rem}
 .nav{flex-direction:row;overflow-x:auto}
 .nav button{white-space:nowrap}
 .side .foot{margin-top:0}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const KEY='osv-mvp-v1';
const ROLES={
 DE:{label:'Directeur exécutif',nav:['dash','plan','projets','validation','personnel','admin','demandes','audit']},
 CA:{label:"Conseil d'administration",nav:['dash','plan','projets']},
 RA:{label:'Responsable administratif',nav:['dash','plan','admin','demandes']},
 RH:{label:'Responsable RH',nav:['dash','plan','personnel','demandes']},
 DP:{label:'Directeur des programmes',nav:['dash','plan','projets','validation','demandes']},
 CP:{label:'Chef de projet',nav:['dash','projets','validation','demandes']},
 SE:{label:'Suivi-évaluation',nav:['dash','projets','validation','demandes']},
 SUP:{label:'Supervision terrain',nav:['dash','projets','validation','demandes']},
 ASC:{label:'Collecte terrain',nav:['collecte','demandes']},
 LECT:{label:'Consultation projet',nav:['dash','projets','demandes']}
};
const NIV_DESC={DE:'Tout voir, tout piloter',CA:'Lecture seule, gouvernance',RA:'Administration, logistique, demandes',RH:'Personnel, postes et accès',DP:'Tous les projets, validation',CP:'Gérer ses projets, valider les données',SE:'Vérifier les données de ses projets',SUP:'Superviser les agents, contrôler leurs saisies',ASC:'Saisir les données de terrain',LECT:'Consulter les projets de son équipe'};
function seedPostes(){return [['DE','Directeur exécutif'],['CA',"Membre du conseil d'administration"],['RA','Responsable administratif'],['RH','Responsable RH'],['DP','Directeur des programmes'],['CP','Chef de projet'],['SE','Chargé de suivi-évaluation'],['ASC','Relais communautaire'],['SUP','Superviseur terrain'],['SE','Assistant suivi-évaluation'],['LECT','Assistant programme']].map(([n,t],i)=>({id:i<8?'po-'+n:'po-x'+i,intitule:t,niveau:n}))}
const VIEWS={dash:'Tableau de bord',plan:'Plan stratégique',projets:'Projets et indicateurs',collecte:'Collecte terrain',validation:'Validation des données',personnel:'Personnel et accès',admin:'Administration',demandes:'Mes demandes',audit:"Journal d'audit"};
const DOMAINES=['DSSR-VBG','Eau et assainissement','Environnement, résilience climatique et HSE','Sécurité routière','Sécurité au travail','Agriculture durable','Gestion des plaintes'];
const STATUTS={soumise:['Soumise','warn'],supervisee:['Contrôlée superviseur','warn'],verifiee:['Vérifiée S&E','warn'],validee:['Validée','ok'],rejetee:['Rejetée','bad']};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>d?new Date(d).toLocaleDateString('fr-FR'):'—';

function seed(){
 const b=[{id:'b1',nom:'Siège',ville:'Yamoussoukro'},{id:'b2',nom:'Bureau technique',ville:'Kong'},{id:'b3',nom:'Bureau technique',ville:'Touba'}];
 const st=[
  ['DE','Compte démo DE','Direction exécutive','DE-1001','b1'],['CA','Compte démo CA',"Conseil d'administration",'CA-1002','b1'],
  ['RA','Compte démo Administration','Administration','RA-1003','b1'],['RH','Compte démo RH','Ressources humaines','RH-1004','b1'],
  ['DP','Compte démo Programmes','Programmes','DP-1005','b1'],['CP','Compte démo Chef de projet','Programmes','CP-1006','b2'],
  ['SE','Compte démo S&E','Programmes','SE-1007','b2'],['ASC','Compte démo Agent terrain','Programmes','ASC-1008','b2'],
  ['SUP','Compte démo Superviseur','Programmes','SUP-1009','b2']
 ].map(([r,n,d,c,bu],i)=>({id:'u'+(i+1),nom:n,role:r,posteId:r==='SUP'?'po-x8':'po-'+r,dept:d,statut:'Salarié',bureau:bu,code:c,actif:true,finAcces:''}));
 const p=[{id:'p1',nom:'Projet démo DSSR-VBG',bailleur:'Bailleur (démo)',montant:0,debut:'',fin:'',zone:'Kong (démo)',domaine:'DSSR-VBG',bureau:'b2',chefId:'u6',prevus:[{posteId:'po-SE',nb:1},{posteId:'po-x8',nb:2},{posteId:'po-ASC',nb:10}],membres:[{staffId:'u6',posteId:'po-CP'},{staffId:'u7',posteId:'po-SE'},{staffId:'u9',posteId:'po-x8'},{staffId:'u8',posteId:'po-ASC'}],indicateurs:[
   {id:'i1',libelle:'Personnes sensibilisées',cible:500,unite:'personnes',sensible:false},
   {id:'i2',libelle:'Cas VBG référés vers une prise en charge',cible:40,unite:'cas',sensible:true}]},
  {id:'p2',nom:'Projet démo Eau et assainissement',bailleur:'Bailleur (démo)',montant:0,debut:'',fin:'',zone:'Touba (démo)',domaine:'Eau et assainissement',bureau:'b3',chefId:'u6',prevus:[],membres:[{staffId:'u6',posteId:'po-CP'},{staffId:'u7',posteId:'po-SE'}],indicateurs:[
   {id:'i3',libelle:"Points d'eau réhabilités",cible:10,unite:'points',sensible:false}]}];
 const c=[{id:'c1',projetId:'p1',indicId:'i1',valeur:120,localite:'Kong (démo)',date:today(),note:'Causerie éducative (démo)',auteurId:'u8',statut:'validee'},
  {id:'c2',projetId:'p1',indicId:'i1',valeur:45,localite:'Kong (démo)',date:today(),note:'',auteurId:'u8',statut:'soumise'},
  {id:'c3',projetId:'p1',indicId:'i2',valeur:3,localite:'Kong (démo)',date:today(),note:'',auteurId:'u8',statut:'verifiee'}];
 return {postes:seedPostes(),bureaux:b,staff:st,projets:p,collectes:c,demandes:[],audit:[{t:new Date().toISOString(),u:null,a:'Données de démonstration créées'}]};
}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const AXES=[
 {k:'projets',nom:'Gestion des projets',resp:'DP'},
 {k:'partenariats',nom:'Partenariats et mobilisation de ressources',resp:'DE'},
 {k:'rh',nom:'Ressources humaines',resp:'RH'},
 {k:'finances',nom:'Comptabilité et finances',resp:'RA'},
 {k:'logistique',nom:'Logistique',resp:'RA'},
 {k:'gouvernance',nom:'Gouvernance organisationnelle',resp:'DE'},
 {k:'risques',nom:'Gestion des risques',resp:'DE'},
 {k:'direction',nom:'Objectifs du directeur exécutif',resp:'DE'}];
const AUTO={projets_realisation:'Réalisation moyenne des indicateurs projets',demandes_traitees:'Demandes administratives traitées',donnees_validees:'Données terrain validées'};
function seedPlan(){
 const o=(axe,libelle,inds)=>({id:uid(),axe,libelle,demo:true,indicateurs:inds.map(([l,u,b,c,a,auto])=>({id:uid(),libelle:l,unite:u,base:b,cible:c,actuel:a??null,auto:auto||null}))});
 return {annee:new Date().getFullYear(),objectifs:[
  o('projets','Atteindre les résultats contractuels des projets',[['Réalisation des indicateurs projets','%',0,100,null,'projets_realisation'],['Rapports aux bailleurs remis à temps','%',0,100,75]]),
  o('partenariats','Diversifier les sources de financement',[['Nouvelles conventions signées','conventions',0,4,2],['Candidatures soumises','dossiers',0,12,7]]),
  o('rh','Disposer d\'un personnel qualifié et stable',[['Postes clés pourvus','%',50,100,80],['Agents formés dans l\'année','agents',0,30,12]]),
  o('finances','Garantir une gestion financière transparente',[['Dépenses avec pièces complètes','%',60,100,85],['Délai de clôture mensuelle','jours',20,10,14]]),
  o('logistique','Rendre la logistique réactive',[['Demandes traitées','%',0,100,null,'demandes_traitees'],['Véhicules à entretien à jour','%',0,100,60]]),
  o('gouvernance','Renforcer la gouvernance interne',[['Réunions du CA tenues','réunions',0,4,3],['Procédures internes adoptées','procédures',0,6,2]]),
  o('risques','Maîtriser les risques majeurs',[['Risques majeurs avec plan d\'atténuation','%',0,100,40],['Incidents de sécurité sur le terrain','incidents',6,2,3]]),
  o('direction','Piloter l\'exécution du plan',[['Revues trimestrielles réalisées','revues',0,4,3],['Données terrain validées','%',0,100,null,'donnees_validees']])]};
}
let S=load()||seed();
if(!S.plan){S.plan=seedPlan()}
if(!S.postes){S.postes=seedPostes();
 S.staff.forEach(s=>{if(!s.posteId)s.posteId='po-'+s.role});
 if(!S.staff.some(s=>s.code==='SUP-1009'))S.staff.push({id:'u9',nom:'Compte démo Superviseur',role:'SUP',posteId:'po-x8',dept:'Programmes',statut:'Salarié',bureau:'b2',code:'SUP-1009',actif:true,finAcces:''});
 S.projets.forEach(p=>{p.prevus=p.prevus||[];p.membres=p.membres||[];
  const add=(id,po)=>{if(!p.membres.some(m=>m.staffId===id))p.membres.push({staffId:id,posteId:po})};
  if(p.chefId)add(p.chefId,'po-CP');
  S.staff.forEach(s=>{if(s.role==='SE')add(s.id,s.posteId);if((s.role==='ASC'||s.role==='SUP')&&s.bureau===p.bureau)add(s.id,s.posteId)})});
}
try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
const poste=id=>S.postes.find(x=>x.id===id);
const posteLib=s=>(poste(s.posteId)||{}).intitule||ROLES[s.role].label;
const fcfa=n=>n?Number(n).toLocaleString('fr-FR')+' FCFA':'—';
function autoVal(k){
 if(k==='projets_realisation'){const is=S.projets.flatMap(p=>p.indicateurs);return is.length?Math.round(is.reduce((s,i)=>s+pct(i),0)/is.length):null}
 if(k==='demandes_traitees'){const d=S.demandes;return d.length?Math.round(d.filter(x=>x.statut!=='En attente').length/d.length*100):null}
 if(k==='donnees_validees'){const c=S.collectes;return c.length?Math.round(c.filter(x=>x.statut==='validee').length/c.length*100):null}
 return null;
}
const valInd=i=>i.auto?autoVal(i.auto):i.actuel;
function perfInd(i){const v=valInd(i);if(v===null||v===undefined||v==='')return null;const b=Number(i.base),c=Number(i.cible),a=Number(v);
 if(c===b)return a===c?100:0;return Math.max(0,Math.min(100,Math.round((a-b)/(c-b)*100)))}
const moy=a=>{const v=a.filter(x=>x!==null);return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length):null};
const perfObj=o=>moy(o.indicateurs.map(perfInd));
const objsAxe=k=>S.plan.objectifs.filter(o=>o.axe===k);
const perfAxe=k=>moy(objsAxe(k).map(perfObj));
const perfGlobal=()=>moy(AXES.map(a=>perfAxe(a.k)));
function attendu(){const y=S.plan.annee,n=new Date();if(n.getFullYear()>y)return 100;if(n.getFullYear()<y)return 0;
 const d0=new Date(y,0,1),d1=new Date(y+1,0,1);return Math.round((n-d0)/(d1-d0)*100)}
function statut(p){if(p===null)return['Pas encore de données',''];const e=p-attendu();return e>=-10?['Dans les temps','ok']:e>=-25?['À surveiller','warn']:['En retard','bad']}
const axesVisibles=()=>['DE','CA'].includes(me.role)?AXES:AXES.filter(a=>a.resp===me.role);
const canEditAxe=a=>me.role==='DE'||a.resp===me.role;
function stratBar(p){const[,cl]=statut(p);return `<div class="bar lg"><i class="${cl}" style="width:${p??0}%"></i><span class="mk" style="left:${attendu()}%" title="Attendu à date"></span></div>`}
function stratSection(){
 const axes=axesVisibles();if(!axes.length)return '';
 const g=['DE','CA'].includes(me.role)?perfGlobal():moy(axes.map(a=>perfAxe(a.k)));const[s,cl]=statut(g);
 return `<section class="card"><div class="strat-head"><div><h2>Plan stratégique ${S.plan.annee}</h2><p class="muted" style="margin:.3rem 0 0">Exécution à date, comparée au rythme attendu : ${attendu()} % de l'année écoulée.</p></div>
 <div class="score"><b>${g??'—'}${g!==null?' %':''}</b><span class="tag ${cl}">${s}</span></div></div>
 ${axes.map(a=>{const p=perfAxe(a.k),[s2,c2]=statut(p);return `<button class="axe" data-act="go" data-v="plan"><div><strong>${esc(a.nom)}</strong> <span class="muted">· ${esc(ROLES[a.resp].label)}</span>${stratBar(p)}</div><div class="num">${p??'—'}${p!==null?' %':''}<br><span class="tag ${c2}">${s2}</span></div></button>`}).join('')}
 <p class="legend">Le trait vertical indique où chaque axe devrait se situer aujourd'hui. Cliquez sur un axe pour voir le détail des objectifs.</p></section>`;
}
let me=null,view='dash',loginErr='';
const can=r=>me&&r.includes(me.role);
const who=id=>(S.staff.find(s=>s.id===id)||{}).nom||'—';
const bur=id=>{const b=S.bureaux.find(x=>x.id===id);return b?b.ville:'—'};

function dash(){
 const ps=projetsVisibles(),inds=ps.flatMap(p=>p.indicateurs);
 const k=[];
 if(ps.length||['DE','CA','DP','CP','SE','SUP','LECT'].includes(me.role)){
  k.push([ps.length,'projets suivis']);
  k.push([inds.length?Math.round(inds.reduce((s,i)=>s+pct(i),0)/inds.length)+' %':'—','réalisation moyenne des indicateurs']);
 }
 if(['SUP','SE','CP','DP','DE'].includes(me.role))k.push([aTraiter().length,'données en attente de votre validation']);
 if(['RH','DE'].includes(me.role)){const lim=new Date(Date.now()+30*864e5).toISOString().slice(0,10);
  k.push([S.staff.filter(s=>s.actif).length,'comptes actifs']);
  k.push([S.staff.filter(s=>s.actif&&s.finAcces&&s.finAcces<=lim).length,'accès expirant sous 30 jours'])}
 if(['RA','DE'].includes(me.role))k.push([S.demandes.filter(d=>d.statut==='En attente').length,'demandes à traiter']);
 return head('Tableau de bord',me.role==='CA'?'Vue de gouvernance en lecture seule.':'Données consolidées selon votre niveau d\'accès. Seules les données validées comptent dans les résultats.')+
 stratSection()+`<div class="kpis">${k.map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`+
 (ps.length?ps.map(p=>projCard(p,false)).join(''):'');
}

function admin(){
 return head('Administration','Bureaux de la structure et demandes logistiques ou administratives à approuver.')+
 `<section class="card"><h3>Demandes à traiter</h3>${demTable(S.demandes,true)}</section>
 <section class="card"><h3>Bureaux</h3><div class="tbl"><table><thead><tr><th>Ville</th><th>Type</th><th>Personnel actif</th></tr></thead><tbody>
 ${S.bureaux.map(b=>`<tr><td>${esc(b.ville)}</td><td>${esc(b.nom)}</td><td>${S.staff.filter(s=>s.bureau===b.id&&s.actif).length}</td></tr>`).join('')}</tbody></table></div>
 <form data-form="bureau" class="grid" style="margin-top:.8rem;align-items:end"><div><label>Ville</label><input name="ville" required></div><div><label>Type</label><select name="nom"><option>Bureau technique</option><option>Antenne</option></select></div><div><button class="btn sm" type="submit">Ajouter le bureau</button></div></form></section>`;
}
function demTable(list,act){
 if(!list.length)return '<p class="empty">Aucune demande.</p>';
 return `<div class="tbl"><table><thead><tr><th>Date</th><th>Type</th><th>Objet</th><th>Demandeur</th><th>Statut</th>${act?'<th></th>':''}</tr></thead><tbody>
 ${list.map(d=>`<tr><td>${fmtD(d.date)}</td><td>${esc(d.type)}</td><td>${esc(d.objet)}</td><td>${esc(who(d.auteurId))}</td><td><span class="tag ${d.statut==='Approuvée'?'ok':d.statut==='Refusée'?'bad':'warn'}">${d.statut}</span></td>${act?`<td class="row">${d.statut==='En attente'?`<button class="btn sm" data-act="dem" data-id="${d.id}" data-to="Approuvée">Approuver</button><button class="btn danger sm" data-act="dem" data-id="${d.id}" data-to="Refusée">Refuser</button>`:''}</td>`:''}</tr>`).join('')}
 </tbody></table></div>`;
}
function demandes(){
 return head('Mes demandes','Matériel, carburant, missions, congés : la demande part au responsable administratif.')+
 `<form class="card" data-form="demande"><div class="grid">
  <div><label>Type</label><select name="type"><option>Matériel</option><option>Carburant</option><option>Mission</option><option>Congé</option><option>Autre</option></select></div>
  <div style="grid-column:span 2"><label>Objet</label><input name="objet" required></div>
 </div><button class="btn" type="submit">Envoyer la demande</button></form>
 <section class="card">${demTable(S.demandes.filter(d=>d.auteurId===me.id),false)}</section>`;
}
function audit(){
 return head("Journal d'audit",'Chaque action est enregistrée avec son auteur et l\'heure. Ce journal ne peut pas être modifié depuis l\'application.')+
 `<section class="card"><div class="tbl"><table><thead><tr><th>Date et heure</th><th>Utilisateur</th><th>Action</th></tr></thead><tbody>
 ${S.audit.map(a=>`<tr><td>${new Date(a.t).toLocaleString('fr-FR')}</td><td>${a.u?esc(who(a.u)):'Système'}</td><td>${esc(a.a)}</td></tr>`).join('')}</tbody></table></div></section>`;
}

document.addEventListener('submit',e=>{
 const f=e.target,t=f.dataset.form;if(!t)return;e.preventDefault();
 const d=Object.fromEntries(new FormData(f));
 if(t==='login'){
  const s=S.staff.find(x=>x.code.toUpperCase()===String(d.code).trim().toUpperCase());
  if(!s||!s.actif){loginErr="Code inconnu ou désactivé. Vérifiez le code ou contactez les ressources humaines.";render();return}
  if(s.finAcces&&s.finAcces<today()){loginErr=`Accès expiré le ${fmtD(s.finAcces)}. Contactez les ressources humaines.`;render();return}
  me=s;loginErr='';view='home';log('Connexion');render();return;
 }
 if(t==='projet'){if(d.fin<d.debut){alert('La date de fin doit être après la date de début.');return}
  S.projets.unshift({id:uid(),nom:d.nom.trim(),bailleur:d.bailleur.trim(),montant:Number(d.montant)||0,debut:d.debut,fin:d.fin,zone:(d.zone||'').trim(),domaine:d.domaine,bureau:d.bureau,chefId:d.chef||null,prevus:[],membres:d.chef?[{staffId:d.chef,posteId:'po-CP'}]:[],indicateurs:[]});log(`Projet enregistré : ${d.nom} (${d.bailleur})`)}
 if(t==='prevu'){const p=S.projets.find(x=>x.id===f.dataset.p),n=Number(d.nb),e=p.prevus.find(x=>x.posteId===d.poste);if(e)e.nb=n;else p.prevus.push({posteId:d.poste,nb:n});log(`Besoin en personnel — ${p.nom} : ${n} × ${poste(d.poste).intitule}`)}
 if(t==='affect'){const p=S.projets.find(x=>x.id===f.dataset.p),s=S.staff.find(x=>x.id===d.staff);if(!s)return;
  p.membres.push({staffId:s.id,posteId:d.poste});if(s.statut!=='Salarié'&&!s.finAcces&&p.fin)s.finAcces=p.fin;log(`${s.nom} affecté(e) à ${p.nom} comme ${poste(d.poste).intitule}`)}
 if(t==='poste'){const t2=d.intitule.trim();if(S.postes.some(x=>x.intitule.toLowerCase()===t2.toLowerCase())){alert('Ce poste existe déjà.');return}
  S.postes.push({id:uid(),intitule:t2,niveau:d.niveau});log(`Poste créé : ${t2} (niveau : ${ROLES[d.niveau].label})`)}
 if(t==='indic'){const p=S.projets.find(x=>x.id===f.dataset.p);p.indicateurs.push({id:uid(),libelle:d.libelle.trim(),cible:Number(d.cible),unite:d.unite.trim(),sensible:!!d.sensible});log(`Indicateur ajouté à ${p.nom} : ${d.libelle}`)}
 if(t==='collecte'){const[pid,iid]=d.ind.split('|');const sens=S.projets.find(p=>p.id===pid).indicateurs.find(i=>i.id===iid).sensible;
  S.collectes.unshift({id:uid(),projetId:pid,indicId:iid,valeur:Number(d.valeur),localite:d.localite.trim(),date:d.date,note:sens?'':(d.note||''),auteurId:me.id,statut:'soumise'});log('Donnée terrain envoyée')}
 if(t==='staff'){const po=poste(d.poste),role=po.niveau,code=role+'-'+Math.floor(1000+Math.random()*9000);
  S.staff.push({id:uid(),nom:d.nom.trim(),role,posteId:po.id,dept:'',statut:d.statut,bureau:d.bureau,code,actif:true,finAcces:d.fin||''});log(`Compte créé : ${d.nom} (${po.intitule})`)}
 if(t==='objectif'){S.plan.objectifs.push({id:uid(),axe:d.axe,libelle:d.libelle.trim(),indicateurs:[]});log(`Objectif stratégique ajouté : ${d.libelle}`)}
 if(t==='pind'){const o=S.plan.objectifs.find(x=>x.id===f.dataset.o);o.indicateurs.push({id:uid(),libelle:d.libelle.trim(),unite:d.unite.trim(),base:Number(d.base),cible:Number(d.cible),actuel:null,auto:null});log(`Indicateur stratégique ajouté : ${d.libelle}`)}
 if(t==='maj'){const o=S.plan.objectifs.find(x=>x.id===f.dataset.o),i=o.indicateurs.find(x=>x.id===f.dataset.i);i.actuel=d.v===''?null:Number(d.v);log(`Plan stratégique mis à jour : ${i.libelle} = ${d.v} ${i.unite}`)}
 if(t==='bureau'){S.bureaux.push({id:uid(),nom:d.nom,ville:d.ville.trim()});log(`Bureau ajouté : ${d.ville}`)}
 if(t==='demande'){S.demandes.unshift({id:uid(),type:d.type,objet:d.objet.trim(),auteurId:me.id,statut:'En attente',date:today()});log(`Demande envoyée : ${d.type}`)}
 save();render();
});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='go'){view=b.dataset.v;render();window.scrollTo(0,0)}
 if(a==='logout'){log('Déconnexion');me=null;render()}
 if(a==='reset'){S=seed();S.plan=seedPlan();save();loginErr='';render()}
 if(a==='val'){const c=S.collectes.find(x=>x.id===b.dataset.id);c.statut=b.dataset.to;log(`Donnée ${STATUTS[c.statut][0].toLowerCase()} (${c.valeur} à ${c.localite})`);render()}
 if(a==='toggle'){const s=S.staff.find(x=>x.id===b.dataset.id);s.actif=!s.actif;log(`Compte ${s.actif?'réactivé':'désactivé'} : ${s.nom}`);render()}
 if(a==='unassign'){const p=S.projets.find(x=>x.id===b.dataset.p);p.membres=p.membres.filter(m=>m.staffId!==b.dataset.s);log(`${who(b.dataset.s)} retiré(e) de ${p.nom}`);render()}
 if(a==='dem'){const d=S.demandes.find(x=>x.id===b.dataset.id);d.statut=b.dataset.to;log(`Demande ${d.statut.toLowerCase()} : ${d.objet}`);render()}
});
document.addEventListener('change',e=>{
 if(e.target.id==='indSel')syncSens();
 if(e.target.classList.contains('affStaff'))syncAff(e.target);
});
function syncSens(){const s=document.getElementById('indSel');if(!s)return;const sens=s.selectedOptions[0]?.dataset.s==='1';
 document.getElementById('sensNote').hidden=!sens;document.getElementById('noteWrap').hidden=sens}
function syncAff(s){const po=s.selectedOptions[0]?.dataset.po,t=s.closest('form').querySelector('.affPoste');if(po&&t&&[...t.options].some(o=>o.value===po))t.value=po}
const _r=render;render=function(){_r();syncSens();document.querySelectorAll('.affStaff').forEach(syncAff)};
render();
</script>
</body>
</html>
